<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#16324f">
<title>Vloedklok</title>
<style>
  :root { --ink:#10263b; --panel:#fdf6e3; --accent:#f2a900; --go:#2f9e44; --no:#9aa5b1; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:#16324f; color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none; touch-action:none; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .screen { position:fixed; inset:0; display:none; flex-direction:column; align-items:center;
    padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom)); }
  .screen.on { display:flex; }
  #dorp { background:rgba(16,38,59,.55); }
  .wrap { width:100%; max-width:460px; display:flex; flex-direction:column; min-height:0; flex:1; }
  h1 { margin:4px 0 2px; color:#fff; font-size:30px; letter-spacing:1px; text-align:center; text-shadow:0 2px 0 #0008; }
  .sub { color:#cfe3f5; text-align:center; font-size:13px; margin-bottom:8px; }
  .res { display:flex; gap:8px; justify-content:center; margin-bottom:8px; }
  .pill { background:#0b1c2c; color:#fff; border-radius:999px; padding:6px 14px; font-weight:700; font-size:16px; }
  .list { flex:1; min-height:0; overflow-y:auto; touch-action:pan-y; display:flex; flex-direction:column; gap:8px; padding-bottom:8px; }
  .card { background:var(--panel); border-radius:14px; padding:10px 12px; display:flex; align-items:center; gap:10px;
    box-shadow:0 3px 0 #0004; }
  .card .ico { font-size:30px; width:40px; text-align:center; }
  .card .txt { flex:1; min-width:0; }
  .card b { font-size:16px; }
  .card small { display:block; color:#4b5b6b; font-size:12.5px; line-height:1.3; }
  button { font:inherit; border:0; border-radius:12px; font-weight:800; color:#fff; background:var(--go);
    min-height:48px; padding:6px 12px; box-shadow:0 3px 0 #0005; touch-action:manipulation; }
  button:active { transform:translateY(2px); box-shadow:0 1px 0 #0005; }
  button.off { background:var(--no); }
  button.gold { background:var(--accent); color:#3b2a00; }
  button.ghost { background:#0b1c2c; }
  .card button { min-width:96px; font-size:13.5px; line-height:1.25; }
  .bar { display:flex; gap:8px; align-items:stretch; padding-top:8px; }
  .bar .big { flex:1; font-size:21px; min-height:64px; }
  .bar .sq { width:56px; font-size:22px; }
  #eind { justify-content:flex-end; background:rgba(16,38,59,.6); }
  #eind .box { background:var(--panel); border-radius:18px; padding:18px; width:100%; max-width:460px; text-align:center; }
  #eind h2 { margin:0 0 6px; font-size:26px; }
  #eind p { margin:4px 0 14px; font-size:16px; line-height:1.5; }
  #eind .bar { padding-top:0; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="dorp" class="screen">
  <div class="wrap">
    <h1>VLOEDKLOK</h1>
    <div class="sub">Ren voor de vloed uit, luid de klok, bouw je dorp.</div>
    <div class="res"><span class="pill" id="rGold"></span><span class="pill" id="rPearl"></span></div>
    <div class="list" id="list"></div>
    <div class="bar">
      <button class="sq ghost" data-act="prev" aria-label="Vorige expeditie">‹</button>
      <button class="big" data-act="play" id="playBtn"></button>
      <button class="sq ghost" data-act="next" aria-label="Volgende expeditie">›</button>
      <button class="sq ghost" data-act="mute" id="muteBtn" aria-label="Geluid"></button>
    </div>
  </div>
</div>

<div id="eind" class="screen">
  <div class="box">
    <h2 id="eTitle"></h2>
    <p id="eText"></p>
    <div class="bar">
      <button class="ghost" data-act="home" style="flex:1">Dorp</button>
      <button class="big" data-act="again" id="eBtn"></button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ===================== Opslag & dorp (meta-laag) ===================== */
const KEY = 'vloedklok.v1';
const DEF = { gold:0, pearls:0, max:1, sel:1, b:{inn:0,shop:0,dike:0,light:0,mine:0}, mineT:Date.now(), mute:false };
function loadSave() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.b) return Object.assign({}, DEF, s, { b:Object.assign({}, DEF.b, s.b) });
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEF));
}
let SV = loadSave();
function save() { try { localStorage.setItem(KEY, JSON.stringify(SV)); } catch (e) {} }

const MAGNET = [0, 70, 110, 150];
// c = kosten per niveau: [goud, parels]
const BLD = {
  mine:  { n:'Goudmolen',  i:'⚙️', d:l => l ? `Maalt ${l*8} goud/min (opslag ${l*240})` : 'Maalt goud, ook als je weg bent', c:[[80,0],[250,1],[600,3],[1300,6]] },
  dike:  { n:'Dijk',       i:'🧱', d:l => l ? `Vloed ${l*4}% trager, meer voorsprong` : 'Remt de vloed af', c:[[120,0],[300,1],[650,3],[1200,6]] },
  light: { n:'Vuurtoren',  i:'🗼', d:l => l ? `Trekt munten aan (bereik ${MAGNET[l]})` : 'Trekt munten naar je toe', c:[[100,0],[350,2],[800,4]] },
  inn:   { n:'Herberg',    i:'🏠', d:l => `${3+l} levens per expeditie`, c:[[150,0],[400,2],[900,5]] },
  shop:  { n:'Werkplaats', i:'🥾', d:l => `${1+l}× springen in de lucht`, c:[[300,3],[800,8]] },
};
function mineStock() {
  const l = SV.b.mine; if (!l) return 0;
  return Math.floor(Math.min(l*240, l*8*(Date.now()-SV.mineT)/60000));
}
const $ = id => document.getElementById(id);
function renderDorp() {
  $('rGold').textContent = '🪙 ' + SV.gold;
  $('rPearl').textContent = '⚪ ' + SV.pearls;
  let h = '';
  for (const k in BLD) {
    const b = BLD[k], l = SV.b[k], c = b.c[l];
    let btn;
    if (!c) btn = `<button class="off" disabled>MAX</button>`;
    else {
      const ok = SV.gold >= c[0] && SV.pearls >= c[1];
      btn = `<button class="${ok?'':'off'}" data-act="up" data-k="${k}">${l?'Upgrade':'Bouw'}<br>🪙${c[0]}${c[1]?' ⚪'+c[1]:''}</button>`;
    }
    let extra = '';
    if (k === 'mine' && l) { const st = mineStock(); extra = ` <button class="gold" data-act="collect" style="min-width:0;min-height:36px;margin-top:4px">Innen 🪙${st}</button>`; }
    h += `<div class="card"><div class="ico">${b.i}</div><div class="txt"><b>${b.n}</b> <small style="display:inline">niv. ${l}</small><small>${b.d(l)}</small>${extra}</div>${btn}</div>`;
  }
  $('list').innerHTML = h;
  $('playBtn').textContent = '▶ Expeditie ' + SV.sel;
  $('muteBtn').textContent = SV.mute ? '🔇' : '🔊';
}
function show(id) { for (const s of document.querySelectorAll('.screen')) s.classList.toggle('on', s.id === id); }
function goDorp() { G.mode = 'dorp'; renderDorp(); show('dorp'); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  audioInit();
  const a = t.dataset.act;
  if (a === 'up') {
    const k = t.dataset.k, c = BLD[k].c[SV.b[k]];
    if (c && SV.gold >= c[0] && SV.pearls >= c[1]) {
      if (k === 'mine') { SV.gold += mineStock(); SV.mineT = Date.now(); }
      SV.gold -= c[0]; SV.pearls -= c[1]; SV.b[k]++; sfx('up'); save();
    } else sfx('no');
    renderDorp();
  } else if (a === 'collect') { const st = mineStock(); if (st) { SV.gold += st; SV.mineT = Date.now(); sfx('coin'); save(); } renderDorp(); }
  else if (a === 'prev') { SV.sel = Math.max(1, SV.sel-1); renderDorp(); }
  else if (a === 'next') { SV.sel = Math.min(SV.max, SV.sel+1); renderDorp(); }
  else if (a === 'mute') { SV.mute = !SV.mute; save(); renderDorp(); }
  else if (a === 'play') start(SV.sel);
  else if (a === 'home') goDorp();
  else if (a === 'again') start(G.mode === 'win' ? Math.min(SV.max, G.n+1) : G.n);
});
setInterval(() => { if (G.mode === 'dorp' && SV.b.mine) renderDorp(); }, 5000);

/* ===================== Geluid ===================== */
let AC = null;
function audioInit() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); }
function tone(f, d, type, v, slide) {
  if (!AC || SV.mute) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t+d);
  g.gain.setValueAtTime(v || .06, t); g.gain.exponentialRampToValueAtTime(.0001, t+d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d);
}
function sfx(n) {
  if (n === 'jump') tone(380, .12, 'square', .04, 620);
  else if (n === 'jump2') tone(520, .12, 'square', .04, 840);
  else if (n === 'coin') tone(1250, .07, 'triangle', .07, 1700);
  else if (n === 'pearl') { tone(900, .12, 'sine', .09, 1400); setTimeout(() => tone(1400, .2, 'sine', .09, 2000), 90); }
  else if (n === 'stomp') tone(240, .12, 'sawtooth', .06, 90);
  else if (n === 'hurt') tone(180, .25, 'sawtooth', .08, 60);
  else if (n === 'up') { tone(520, .1, 'triangle', .08); setTimeout(() => tone(780, .18, 'triangle', .08), 100); }
  else if (n === 'no') tone(140, .12, 'square', .05);
  else if (n === 'bell') { tone(660, .9, 'sine', .12); tone(990, .9, 'sine', .05); setTimeout(() => { tone(660, 1.1, 'sine', .12); tone(990, 1.1, 'sine', .05); }, 380); }
}

/* ===================== Levelgenerator (deterministisch per level) ===================== */
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const PW = 26, PH = 40;

function genLevel(n) {
  const r = rng(n*7919 + 13), D = clamp((n-1)/14, 0, 1);
  const len = 4600 + Math.min(n, 20)*420;
  const L = { blocks:[], plats:[], coins:[], foes:[], flagX:0 };
  let x = -900, y = 500, pearls = 0;
  L.blocks.push({ x, y, w:1500 }); x += 1500;
  while (x < len) {
    let dy, gap = 0;
    if (r() < .45 + .15*D) { gap = 70 + r()*(50 + 60*D); dy = (r()*2 - 1)*40; }
    else dy = (r() < .5 ? -1 : 1)*(30 + r()*40);
    const ny = clamp(y + dy, 400, 540);
    if (gap) { // muntenboog over het gat
      for (let i = 1; i <= 4; i++) { const k = i/5; L.coins.push({ x:x + gap*k, y:(y + (ny-y)*k) - 30 - Math.sin(k*Math.PI)*70, t:0 }); }
    }
    x += gap; y = ny;
    const w = 240 - 40*D + r()*360;
    L.blocks.push({ x, y, w });
    const roll = r(); let crab = false;
    if (w > 330 && roll < .3 + .35*D) { // krab
      const a = x + 140, b = x + w - 50; crab = true;
      L.foes.push({ k:0, x:a + r()*(b-a-30), y:y-22, w:30, h:22, a, b, vx:(40 + 40*D)*(r() < .5 ? -1 : 1), by:y-22, ph:r()*6 });
    } else if (roll < .75) { // munten op de grond
      const c = 3 + Math.floor(r()*4);
      for (let i = 0; i < c && 70 + i*30 < w - 20; i++) L.coins.push({ x:x + 70 + i*30, y:y - 26, t:0 });
    }
    if (w > 260 && r() < .4) { // zwevend plankier, soms een tweede met parel
      const pw = 90 + r()*50, px = x + 60 + r()*(w - pw - 100);
      L.plats.push({ x:px, y:y - 92, w:pw });
      for (let i = 0; i < 3; i++) L.coins.push({ x:px + pw/2 + (i-1)*26, y:y - 118, t:0 });
      if (pearls < 3 && r() < .6 && px + pw + 110 < x + w) {
        L.plats.push({ x:px + pw + 30, y:y - 178, w:70 });
        L.coins.push({ x:px + pw + 65, y:y - 206, t:1 }); pearls++;
      }
    } else if (n >= 3 && !crab && w > 340 && r() < .15 + .3*D) { // meeuw (nooit boven een krab of de landingszone)
      L.foes.push({ k:1, x:x + w*.6, y:y-100, w:30, h:16, a:x + 170, b:x + w - 30, vx:-(30 + 40*D), by:y - 100, ph:r()*6 });
    }
    x += w;
  }
  const gap = 80; x += gap; y = clamp(y, 420, 520);
  L.blocks.push({ x, y, w:1400 });
  if (pearls === 0) L.coins.push({ x:x + 120, y:y - 120, t:1 });
  L.flagX = x + 320; L.flagY = y;
  return L;
}

/* ===================== Spel ===================== */
const STEP = 1/120, GRAV = 2000, JUMP = 660, JUMP2 = 600;
const G = { mode:'dorp', n:1, t:0, bgX:0, parts:[] };
let held = false;

function start(n) {
  const L = genLevel(n);
  Object.assign(G, L, {
    mode:'play', n, t:0, gold:0, pearls:0, parts:[],
    hearts:3 + SV.b.inn, maxAir:1 + SV.b.shop, magnet:MAGNET[SV.b.light],
    speed:220 + 5*Math.min(n, 16),
    p:{ x:0, y:500 - PH, vy:0, ground:true, coy:0, buf:0, air:0, inv:0, stall:0 },
  });
  G.fSpeed = G.speed*(.93 - .04*SV.b.dike);
  G.fMax = 400 + 50*SV.b.dike;
  G.floodX = -G.fMax; G.p.air = G.maxAir;
  held = false; show('none');
}
function press() { if (G.mode === 'play') { G.p.buf = .13; held = true; } }
function release() { held = false; if (G.mode === 'play' && G.p.vy < -200) G.p.vy *= .45; }

function burst(x, y, col, c) { for (let i = 0; i < c; i++) G.parts.push({ x, y, vx:(Math.random()-.5)*260, vy:-Math.random()*260, l:.5, col }); }
function hurt() {
  const p = G.p; if (p.inv > 0) return;
  G.hearts--; p.inv = 1.4; sfx('hurt'); if (navigator.vibrate) navigator.vibrate(60);
  burst(p.x + PW/2, p.y + PH/2, '#e03131', 10);
  if (G.hearts <= 0) end(false, 'Je levens zijn op.');
}
function end(win, why) {
  if (G.mode !== 'play') return;
  G.mode = win ? 'win' : 'lose';
  let txt;
  if (win) {
    const bonus = 20 + 5*G.n, first = G.n === SV.max;
    SV.gold += G.gold + bonus; SV.pearls += G.pearls + (first ? 1 : 0);
    if (first) { SV.max++; } SV.sel = Math.min(SV.max, G.n + 1);
    sfx('bell');
    txt = `Het dorp is gewaarschuwd!<br>🪙 ${G.gold} + ${bonus} bonus &nbsp; ⚪ ${G.pearls}${first ? ' + 1 (eerste keer)' : ''}`;
    $('eTitle').textContent = '🔔 Klok geluid!'; $('eBtn').textContent = '▶ Expeditie ' + SV.sel;
  } else {
    const keep = Math.floor(G.gold/2); SV.gold += keep;
    txt = `${why}<br>Je redt de helft van je buit: 🪙 ${keep}. Parels zijn verloren.`;
    $('eTitle').textContent = '🌊 Verzwolgen'; $('eBtn').textContent = '↻ Opnieuw';
  }
  save(); $('eText').innerHTML = txt; show('eind');
}

function step() {
  const p = G.p, dt = STEP; G.t += dt;
  // springen
  if (p.buf > 0) {
    p.buf -= dt;
    if (p.ground || p.coy > 0) { p.vy = -JUMP; p.ground = false; p.coy = 0; p.buf = 0; sfx('jump'); }
    else if (p.air > 0) { p.vy = -JUMP2; p.air--; p.buf = 0; sfx('jump2'); burst(p.x + PW/2, p.y + PH, '#fff', 5); }
  }
  p.coy -= dt; if (p.inv > 0) p.inv -= dt;
  // horizontaal: muren houden je tegen (en de vloed haalt je in)
  let nx = p.x + G.speed*dt, stalled = false;
  for (const b of G.blocks) {
    if (b.x > nx + PW) break;
    if (p.y + PH > b.y + 1 && p.x + PW <= b.x + .5 && nx + PW > b.x) { nx = b.x - PW; stalled = true; }
  }
  p.x = nx; p.stall = stalled ? p.stall + dt : 0;
  // verticaal
  p.vy = Math.min(p.vy + GRAV*dt, 1100);
  let ny = p.y + p.vy*dt, landed = false;
  if (p.vy >= 0) {
    const test = (s) => { if (p.x + PW > s.x && p.x < s.x + s.w && p.y + PH <= s.y + 1 && ny + PH >= s.y) { ny = s.y - PH; landed = true; } };
    for (const b of G.blocks) { if (b.x > p.x + PW) break; test(b); }
    for (const s of G.plats) test(s);
  }
  p.y = ny;
  if (landed) { p.vy = 0; p.ground = true; p.air = G.maxAir; }
  else { if (p.ground) p.coy = .09; p.ground = false; }
  // in het water gevallen
  if (p.y > 640) {
    hurt(); if (G.mode !== 'play') return;
    p.inv = Math.max(p.inv, 1.4);
    const b = G.blocks.find(b => b.x + b.w > p.x + PW + 40) || G.blocks[G.blocks.length-1];
    p.x = Math.max(b.x + 12, p.x); p.y = b.y - PH; p.vy = 0; p.ground = true; p.air = G.maxAir;
  }
  // munten & parels
  for (let i = G.coins.length-1; i >= 0; i--) {
    const c = G.coins[i], dx = p.x + PW/2 - c.x, dy = p.y + PH/2 - c.y, d2 = dx*dx + dy*dy;
    if (G.magnet && d2 < G.magnet*G.magnet) { const d = Math.sqrt(d2) || 1; c.x += dx/d*520*dt; c.y += dy/d*520*dt; }
    if (Math.abs(dx) < PW/2 + 10 && Math.abs(dy) < PH/2 + 10) {
      if (c.t) { G.pearls++; sfx('pearl'); burst(c.x, c.y, '#ffd6ec', 10); } else { G.gold++; sfx('coin'); }
      G.coins.splice(i, 1);
    }
  }
  // vijanden
  for (const f of G.foes) {
    if (f.dead) continue;
    f.x += f.vx*dt; if (f.x < f.a) { f.x = f.a; f.vx = -f.vx; } else if (f.x + f.w > f.b) { f.x = f.b - f.w; f.vx = -f.vx; }
    if (f.k === 1) f.y = f.by + Math.sin(G.t*3 + f.ph)*16;
    if (p.x + PW > f.x + 3 && p.x < f.x + f.w - 3 && p.y + PH > f.y + 2 && p.y < f.y + f.h) {
      if (p.vy > 0 && p.y + PH - p.vy*dt <= f.y + 12) {
        f.dead = true; p.vy = -460; p.air = G.maxAir; p.ground = false; G.gold += 5;
        sfx('stomp'); burst(f.x + f.w/2, f.y, f.k ? '#fff' : '#ff6b6b', 12);
      } else hurt();
    }
  }
  if (G.mode !== 'play') return;
  // de vloed
  G.floodX = Math.max(G.floodX + G.fSpeed*dt, p.x - G.fMax);
  if (G.floodX > p.x + PW*.6) return end(false, 'De vloed heeft je ingehaald.');
  if (p.x > G.flagX) return end(true);
  for (let i = G.parts.length-1; i >= 0; i--) { const q = G.parts[i]; q.l -= dt; q.vy += 900*dt; q.x += q.vx*dt; q.y += q.vy*dt; if (q.l <= 0) G.parts.splice(i, 1); }
}

/* ===================== Tekenen ===================== */
const cv = $('c'), ctx = cv.getContext('2d');
let W = 420, H = 640, S = 1, OY = 0;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5), w = innerWidth, h = innerHeight;
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  const s = Math.min(h/640, w/420); S = s*dpr; W = w/s; H = h/s; OY = H*.72 - 540;
}
addEventListener('resize', resize); resize();

const SKY = [['#8fd3ff','#e8f7ff'], ['#ffb37a','#ffe9c9'], ['#6fa8dc','#d9ecff'], ['#5b5fa8','#f3b6a0']];
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }

function drawBg(cam) {
  const pal = SKY[(G.n-1) % SKY.length], g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, pal[0]); g.addColorStop(.75, pal[1]); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff8'; ctx.beginPath(); ctx.arc(W*.78, OY + 190, 34, 0, 7); ctx.fill();
  ctx.fillStyle = '#fffc';
  for (let i = 0; i < 6; i++) { const x = ((i*310 - cam*.08) % (W + 300) + W + 300) % (W + 300) - 150, y = OY + 150 + (i*53 % 120); rr(x, y, 90, 22, 11); ctx.fill(); rr(x + 22, y - 12, 46, 22, 11); ctx.fill(); }
  // verre heuvels
  ctx.fillStyle = '#7fbf7f'; ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W + 16; x += 16) { const wx = x + cam*.2; ctx.lineTo(x, OY + 440 + Math.sin(wx*.006)*26 + Math.sin(wx*.017)*10); }
  ctx.lineTo(W, H); ctx.fill();
  // molens
  const sp = 520, off = cam*.35, i0 = Math.floor(off/sp);
  for (let i = i0; i <= i0 + Math.ceil(W/sp) + 1; i++) {
    const x = i*sp - off + 120, y = OY + 455;
    ctx.fillStyle = '#6b4f3a'; ctx.beginPath(); ctx.moveTo(x - 14, y); ctx.lineTo(x - 8, y - 60); ctx.lineTo(x + 8, y - 60); ctx.lineTo(x + 14, y); ctx.fill();
    ctx.save(); ctx.translate(x, y - 58); ctx.rotate(G.t*.8 + i); ctx.fillStyle = '#f4ead5';
    for (let k = 0; k < 4; k++) { ctx.rotate(Math.PI/2); ctx.fillRect(-3, 0, 6, 44); ctx.fillRect(3, 10, 8, 32); }
    ctx.restore();
  }
  ctx.fillStyle = '#5da35d'; ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W + 16; x += 16) { const wx = x + cam*.35; ctx.lineTo(x, OY + 470 + Math.sin(wx*.009 + 2)*16); }
  ctx.lineTo(W, H); ctx.fill();
}
function drawWater(cam) { // water in de gaten
  ctx.fillStyle = '#2b7fc4'; ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W + 12; x += 12) ctx.lineTo(x, OY + 585 + Math.sin((x + cam)*.03 + G.t*2.5)*5);
  ctx.lineTo(W, H); ctx.fill();
}
function drawHero(x, y, p) {
  if (p.inv > 0 && Math.floor(G.t*14) % 2) return;
  const run = p.ground ? Math.sin(G.t*18) : .6;
  ctx.fillStyle = '#28435e'; ctx.fillRect(x + 5 + run*4, y + 31, 6, 9); ctx.fillRect(x + 15 - run*4, y + 31, 6, 9);
  ctx.fillStyle = '#ffc928'; rr(x + 1, y + 13, 24, 21, 6); ctx.fill();
  ctx.fillStyle = '#f3c9a5'; rr(x + 5, y + 3, 18, 14, 6); ctx.fill();
  ctx.fillStyle = '#e0a800'; rr(x - 1, y + 2, 26, 6, 3); ctx.fill(); rr(x + 4, y - 3, 17, 8, 5); ctx.fill();
  ctx.fillStyle = '#10263b'; ctx.fillRect(x + 18, y + 9, 3, 3);
}
function drawFoe(f, cam) {
  const x = f.x - cam, y = f.y + OY;
  if (f.k === 0) {
    const wg = Math.sin(G.t*12 + f.ph)*2;
    ctx.strokeStyle = '#a61e1e'; ctx.lineWidth = 2.5; ctx.beginPath();
    for (let i = 0; i < 3; i++) { ctx.moveTo(x + 5 + i*4, y + 16); ctx.lineTo(x + 1 + i*4, y + 22 + (i%2 ? wg : -wg)*.5); ctx.moveTo(x + 25 - i*4, y + 16); ctx.lineTo(x + 29 - i*4, y + 22 + (i%2 ? -wg : wg)*.5); }
    ctx.stroke();
    ctx.fillStyle = '#e03131'; ctx.beginPath(); ctx.ellipse(x + 15, y + 12, 14, 9, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 1, y + 5 + wg, 5, 0, 7); ctx.arc(x + 29, y + 5 - wg, 5, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(x + 9, y + 1, 4, 6); ctx.fillRect(x + 17, y + 1, 4, 6);
    ctx.fillStyle = '#000'; ctx.fillRect(x + 10, y + 2, 2, 3); ctx.fillRect(x + 18, y + 2, 2, 3);
  } else {
    const fl = Math.sin(G.t*10 + f.ph)*9;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#55657a'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(x + 15, y + 9, 12, 6, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 8, y + 7); ctx.lineTo(x + 15, y - 4 + fl); ctx.lineTo(x + 22, y + 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#f59f00'; ctx.beginPath(); ctx.moveTo(x + 1, y + 7); ctx.lineTo(x - 6, y + 10); ctx.lineTo(x + 2, y + 11); ctx.fill();
    ctx.fillStyle = '#000'; ctx.fillRect(x + 6, y + 6, 2, 2);
  }
}
function drawWorld(cam) {
  drawWater(cam);
  for (const b of G.blocks) {
    const x = b.x - cam; if (x > W || x + b.w < 0) continue; const y = b.y + OY;
    ctx.fillStyle = '#7a5236'; ctx.fillRect(x, y, b.w, H - y);
    ctx.fillStyle = '#684428'; ctx.fillRect(x, y, 4, H - y); ctx.fillRect(x + b.w - 4, y, 4, H - y);
    ctx.fillStyle = '#5fae3b'; rr(x - 2, y - 2, b.w + 4, 14, 5); ctx.fill();
    ctx.fillStyle = '#4c9130'; ctx.fillRect(x, y + 9, b.w, 3);
  }
  for (const s of G.plats) {
    const x = s.x - cam; if (x > W || x + s.w < 0) continue;
    ctx.fillStyle = '#b0793f'; rr(x, s.y + OY, s.w, 12, 3); ctx.fill();
    ctx.fillStyle = '#8a5a2b'; ctx.fillRect(x + 3, s.y + OY + 8, s.w - 6, 3);
  }
  // klokkentoren (finish)
  const fx = G.flagX - cam + 30, fy = G.flagY + OY;
  if (fx < W + 80) {
    ctx.fillStyle = '#8d6e63'; ctx.fillRect(fx - 4, fy - 130, 8, 130); ctx.fillRect(fx + 44, fy - 130, 8, 130); ctx.fillRect(fx - 12, fy - 138, 72, 10);
    ctx.fillStyle = '#c62828'; ctx.beginPath(); ctx.moveTo(fx - 16, fy - 138); ctx.lineTo(fx + 24, fy - 168); ctx.lineTo(fx + 64, fy - 138); ctx.fill();
    ctx.save(); ctx.translate(fx + 24, fy - 126); ctx.rotate(Math.sin(G.t*5)*(G.mode === 'win' ? .5 : .08));
    ctx.fillStyle = '#f2a900'; ctx.beginPath(); ctx.moveTo(-14, 30); ctx.quadraticCurveTo(-12, 0, 0, 0); ctx.quadraticCurveTo(12, 0, 14, 30); ctx.fill(); ctx.beginPath(); ctx.arc(0, 33, 4, 0, 7); ctx.fill();
    ctx.restore();
  }
  for (const c of G.coins) {
    const x = c.x - cam; if (x > W + 20 || x < -20) continue; const y = c.y + OY + Math.sin(G.t*4 + c.x*.05)*3;
    if (c.t) { ctx.fillStyle = '#ffffff55'; ctx.beginPath(); ctx.arc(x, y, 15, 0, 7); ctx.fill(); ctx.fillStyle = '#fff0f8'; ctx.beginPath(); ctx.arc(x, y, 9, 0, 7); ctx.fill(); ctx.fillStyle = '#f7b3d6'; ctx.beginPath(); ctx.arc(x + 2, y + 2, 5, 0, 7); ctx.fill(); }
    else { ctx.fillStyle = '#e09b00'; ctx.beginPath(); ctx.arc(x, y, 8, 0, 7); ctx.fill(); ctx.fillStyle = '#ffd43b'; ctx.beginPath(); ctx.arc(x - 1, y - 1, 6, 0, 7); ctx.fill(); }
  }
  for (const f of G.foes) if (!f.dead && f.x - cam < W + 40 && f.x - cam > -40) drawFoe(f, cam);
  drawHero(G.p.x - cam, G.p.y + OY, G.p);
  for (const q of G.parts) { ctx.fillStyle = q.col; ctx.globalAlpha = Math.max(0, q.l*2); ctx.fillRect(q.x - cam - 2, q.y + OY - 2, 4, 4); } ctx.globalAlpha = 1;
  // vloedgolf
  const wx = G.floodX - cam;
  if (wx > -30) {
    ctx.fillStyle = 'rgba(28,104,184,.86)'; ctx.beginPath(); ctx.moveTo(-10, 0);
    for (let y = 0; y <= H + 14; y += 14) ctx.lineTo(wx + Math.sin(y*.035 + G.t*5)*9 + Math.sin(y*.011 - G.t*2)*8, y);
    ctx.lineTo(-10, H); ctx.fill();
    ctx.strokeStyle = '#eaf6ff'; ctx.lineWidth = 4; ctx.beginPath();
    for (let y = 0; y <= H + 14; y += 14) ctx.lineTo(wx + Math.sin(y*.035 + G.t*5)*9 + Math.sin(y*.011 - G.t*2)*8, y);
    ctx.stroke();
  }
}
function drawHud() {
  const p = G.p, dist = p.x - G.floodX, danger = clamp(1 - (dist - 60)/(G.fMax - 60), 0, 1);
  if (danger > .35) { ctx.fillStyle = `rgba(28,104,184,${(danger - .35)*.9*(.7 + .3*Math.sin(G.t*10))})`; ctx.fillRect(0, 0, 14 + danger*26, H); }
  // voortgangsbalk = de vloedklok
  const bx = 16, bw = W - 32, by = 18, k = v => bx + clamp(v/G.flagX, 0, 1)*bw;
  ctx.fillStyle = '#0b1c2c99'; rr(bx - 4, by - 4, bw + 8, 18, 9); ctx.fill();
  ctx.fillStyle = '#2b7fc4'; rr(bx, by, Math.max(4, k(G.floodX) - bx), 10, 5); ctx.fill();
  ctx.fillStyle = '#ffc928'; ctx.beginPath(); ctx.arc(k(p.x), by + 5, 7, 0, 7); ctx.fill();
  ctx.fillStyle = '#f2a900'; ctx.font = '16px system-ui'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText('🔔', bx + bw + 6, by + 5);
  ctx.textAlign = 'left'; ctx.font = '18px system-ui'; let hs = ''; for (let i = 0; i < G.hearts; i++) hs += '❤️'; ctx.fillText(hs, 14, 52);
  ctx.font = 'bold 18px system-ui'; ctx.textAlign = 'right'; ctx.fillStyle = '#10263b';
  ctx.fillText(`🪙 ${G.gold}   ⚪ ${G.pearls}`, W - 14, 52);
  ctx.textAlign = 'center'; ctx.font = 'bold 13px system-ui'; ctx.fillStyle = '#10263bcc'; ctx.fillText('Expeditie ' + G.n, W/2, 52);
  if (G.n === 1 && G.t < 6 && G.mode === 'play') {
    ctx.fillStyle = '#0b1c2ccc'; rr(W/2 - 170, OY + 200, 340, 58, 12); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 15px system-ui'; ctx.fillText('Tik = springen · vasthouden = hoger', W/2, OY + 220);
    ctx.font = '14px system-ui'; ctx.fillText('Tik in de lucht = dubbelsprong · blijf de vloed voor', W/2, OY + 242);
  }
  if (p.stall > .15 && Math.floor(G.t*6) % 2) { ctx.fillStyle = '#c92a2a'; ctx.font = 'bold 22px system-ui'; ctx.fillText('SPRING!', W/2, OY + 300); }
}
function draw() {
  ctx.setTransform(S, 0, 0, S, 0, 0);
  if (G.mode === 'dorp') { drawBg(G.bgX); ctx.fillStyle = '#2b7fc4'; ctx.fillRect(0, OY + 520, W, H); return; }
  const cam = G.p.x - W*.25;
  drawBg(cam); drawWorld(cam); drawHud();
}

/* ===================== Lus & invoer ===================== */
let last = 0, acc = 0;
function frame(t) {
  const dt = Math.min(.05, (t - last)/1000 || 0); last = t;
  if (G.mode === 'play') { acc += dt; while (acc >= STEP && G.mode === 'play') { step(); acc -= STEP; } }
  else { acc = 0; G.t += dt; G.bgX += dt*25; }
  draw(); requestAnimationFrame(frame);
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); press(); });
addEventListener('pointerup', release); addEventListener('pointercancel', release);
addEventListener('keydown', e => { if ((e.code === 'Space' || e.code === 'ArrowUp') && !e.repeat) { e.preventDefault(); audioInit(); press(); } });
addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'ArrowUp') release(); });
addEventListener('contextmenu', e => e.preventDefault());

window.VK = { G, get SV() { return SV; }, start, step, press, release, genLevel };
goDorp(); requestAnimationFrame(frame);
</script>
