<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#16324f">
<title>Vloedklok</title>
<style>
  :root { --ink:#10263b; --panel:#fdf6e3; --accent:#f2a900; --go:#2f9e44; --no:#9aa5b1; --dark:#0b1c2c; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:#16324f; color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none; touch-action:none; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .screen { position:fixed; inset:0; display:none; flex-direction:column; align-items:center;
    padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom)); }
  .screen.on { display:flex; }
  #dorp, #winkel { background:rgba(16,38,59,.55); }
  .wrap { width:100%; max-width:460px; display:flex; flex-direction:column; min-height:0; flex:1; gap:8px; }
  .top { display:flex; align-items:center; gap:8px; }
  h1 { margin:0; flex:1; color:#fff; font-size:22px; letter-spacing:1px; text-shadow:0 2px 0 #0008; }
  .res { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }
  .pill { background:var(--dark); color:#fff; border-radius:999px; padding:6px 12px; font-weight:700; font-size:15px; }
  button { font:inherit; border:0; border-radius:12px; font-weight:800; color:#fff; background:var(--go);
    min-height:48px; padding:6px 12px; box-shadow:0 3px 0 #0005; touch-action:manipulation; }
  button:active { transform:translateY(2px); box-shadow:0 1px 0 #0005; }
  button.off { background:var(--no); }
  button.gold { background:var(--accent); color:#3b2a00; }
  button.ghost { background:var(--dark); }
  button.gem { background:#3b5bdb; }
  .top button { min-height:42px; padding:6px 9px; font-size:14px; }
  #raid { justify-content:flex-end; pointer-events:none; }
  #raid .bar { pointer-events:auto; width:100%; max-width:460px; }
  #raid .bar button { flex:1; font-size:17px; min-height:58px; }
  .chip { min-height:44px; min-width:44px; padding:4px 8px; font-size:20px; background:#fff; color:var(--ink); border:2px solid #d8cfb4; box-shadow:none; }
  input.nm { font:inherit; font-weight:700; width:100%; min-height:44px; border-radius:10px; border:2px solid #d8cfb4; padding:6px 10px; background:#fff; color:var(--ink); -webkit-user-select:text; user-select:text; }
  .ok { color:#2b8a3e; font-weight:700; } .nok { color:#a15c00; }

  /* dorpskaart met bouwplaatsen */
  .map { position:relative; flex:1; min-height:310px; border-radius:18px; overflow:hidden; background:#2b7fc4; box-shadow:0 3px 0 #0004; }
  .map svg { position:absolute; inset:0; width:100%; height:100%; }
  .plot { position:absolute; transform:translate(-50%,-50%); width:58px; height:58px; min-height:0; padding:0; border-radius:50%;
    font-size:30px; line-height:1; box-shadow:0 4px 0 #0004; }
  .plot:active { transform:translate(-50%,-48%); }
  .plot.empty { background:#ffffff40; border:3px dashed #fff; color:#fff; font-size:28px; }
  .plot.built { background:var(--panel); border:3px solid #8a5a2b; }
  .plot.sel { outline:4px solid var(--accent); outline-offset:2px; }
  .plot .lv { position:absolute; right:-6px; bottom:-4px; background:var(--dark); color:#fff; font-size:11px; border-radius:999px; padding:3px 6px; }
  .plot .nm { position:absolute; left:50%; top:100%; transform:translateX(-50%); margin-top:4px; white-space:nowrap; font-size:11px; color:#fff;
    background:#0b1c2cb0; border-radius:6px; padding:1px 6px; }
  .plot .tr { position:absolute; left:-8px; top:-8px; font-size:15px; background:#0b1c2cc0; border-radius:999px; padding:2px 4px; }
  .plot .bub { position:absolute; left:50%; top:-16px; transform:translateX(-50%); font-size:18px; animation:bob 1s infinite alternate; }
  @keyframes bob { to { margin-top:-5px; } }
  @media (prefers-reduced-motion: reduce) { .plot .bub { animation:none; } }

  .sheet { background:var(--panel); border-radius:14px; padding:10px 12px; min-height:84px; max-height:24vh; overflow-y:auto; touch-action:pan-y;
    display:flex; flex-direction:column; gap:8px; box-shadow:0 3px 0 #0004; }
  .row { display:flex; align-items:center; gap:10px; }
  .row .ico { font-size:28px; width:36px; text-align:center; }
  .row .txt { flex:1; min-width:0; }
  .row b { font-size:15.5px; }
  .row small { display:block; color:#4b5b6b; font-size:12.5px; line-height:1.3; }
  .row button { min-width:92px; font-size:13.5px; line-height:1.25; }
  .hint { color:#4b5b6b; font-size:14px; text-align:center; margin:auto 0; }
  .bar { display:flex; gap:8px; align-items:stretch; }
  .bar .big { flex:1; font-size:19px; min-height:62px; }
  .bar .sq { width:52px; font-size:22px; }
  .list { flex:1; min-height:0; overflow-y:auto; touch-action:pan-y; display:flex; flex-direction:column; gap:8px; }
  .card { background:var(--panel); border-radius:14px; padding:10px 12px; box-shadow:0 3px 0 #0004; }
  h3 { margin:6px 0 0; color:#fff; font-size:15px; }
  .note { background:#fff3bf; color:#5c3c00; border-radius:10px; padding:8px 10px; font-size:13px; line-height:1.35; }
  #eind { justify-content:flex-end; background:rgba(16,38,59,.6); }
  #eind .box { background:var(--panel); border-radius:18px; padding:18px; width:100%; max-width:460px; text-align:center; }
  #eind h2 { margin:0 0 6px; font-size:26px; }
  #eind p { margin:4px 0 14px; font-size:16px; line-height:1.5; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="dorp" class="screen">
  <div class="wrap">
    <div class="top">
      <h1>VLOEDKLOK</h1>
      <button class="ghost" data-act="verd">🛡️ Verdediging</button>
      <button class="gem" data-act="shop" aria-label="Winkel">🛒</button>
      <button class="ghost" data-act="mute" id="muteBtn" aria-label="Geluid"></button>
    </div>
    <div class="res" id="res"></div>
    <div class="map" id="map"></div>
    <div class="sheet" id="sheet"></div>
    <div class="bar">
      <button class="big" data-act="leger" style="background:#a61e4d">⚔️ Aanvallen</button>
      <button class="ghost" data-act="play" id="playBtn" style="font-size:13px;line-height:1.2"></button>
      <button class="ghost" data-act="endless" id="endBtn" style="font-size:13px;line-height:1.2"></button>
    </div>
  </div>
</div>

<div id="winkel" class="screen">
  <div class="wrap">
    <div class="top"><h1>WINKEL</h1><button class="ghost" data-act="home">✕ Dorp</button></div>
    <div class="res" id="res2"></div>
    <div class="list" id="shopList"></div>
  </div>
</div>

<div id="leger" class="screen" style="background:rgba(16,38,59,.55)">
  <div class="wrap">
    <div class="top"><h1>AANVAL</h1><button class="ghost" data-act="home">✕ Dorp</button></div>
    <div class="res" id="res3"></div>
    <div class="list" id="armyList"></div>
    <div class="bar">
      <button class="ghost" data-act="rnext" style="font-size:14px">↻ Ander<br>dorp</button>
      <button class="big" data-act="raid" id="raidBtn" style="background:#a61e4d"></button>
    </div>
  </div>
</div>

<div id="verd" class="screen" style="background:rgba(16,38,59,.55)">
  <div class="wrap">
    <div class="top"><h1>VERDEDIGING</h1><button class="ghost" data-act="home">✕ Dorp</button></div>
    <div class="res" id="res4"></div>
    <div class="list" id="defList"></div>
  </div>
</div>

<div id="raid" class="screen"><div class="bar" id="raidBar"></div></div>

<div id="eind" class="screen">
  <div class="box">
    <h2 id="eTitle"></h2>
    <p id="eText"></p>
    <div class="bar">
      <button class="ghost" data-act="home" style="flex:1">Dorp</button>
      <button class="gem" data-act="revive" id="revBtn" style="flex:1"></button>
      <button class="big" data-act="again" id="eBtn"></button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ===================== Opslag ===================== */
const KEY = 'vloedklok.v1';
const DEV = /[?&]dev=1/.test(location.search);
const DEF = { gold:0, pearls:0, diamonds:0, max:1, sel:1, best:0, b:{hall:1,inn:0,shop:0,dike:0,light:0,mine:0,bar:0,arch:0,bank:0}, job:null,
  army:{t:0,a:0,s:0}, tr:0, def:[['k'],['k'],['k','k']], name:'Dorp-' + Math.floor(1000 + Math.random()*9000), seen:0, log:[], plots:[null,null,null,null,null,null,'hall',null,null], mineT:Date.now(), mute:false };
function loadSave() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  const v = JSON.parse(JSON.stringify(DEF));
  if (s && s.b) { Object.assign(v, s); v.b = Object.assign({}, DEF.b, s.b); v.army = Object.assign({}, DEF.army, s.army); v.plots = (s.plots || DEF.plots).slice(0, 9); while (v.plots.length < 9) v.plots.push(null); v.b.hall = Math.max(1, v.b.hall); }
  for (const k in v.b) if (v.b[k] > 0 && !v.plots.includes(k)) { let i = k === 'hall' && !v.plots[6] ? 6 : v.plots.indexOf(null); if (i >= 0) v.plots[i] = k; } // oude saves een plek geven
  return v;
}
let SV = loadSave();
function save() { try { localStorage.setItem(KEY, JSON.stringify(SV)); } catch (e) {} }

/* ===================== Dorp: gebouwen op bouwplaatsen ===================== */
const MAGNET = [0, 70, 110, 150];
// c = kosten per niveau: [goud, parels]
const BLD = {
  hall:  { n:'Stadhuis',   i:'🏛️', likes:'centrum', bonus:'10% kortere bouwtijd', d:l => `Andere gebouwen kunnen tot niveau ${l}`, c:[[0,0],[400,1],[1200,4],[3000,8]] },
  bank:  { n:'Bank',       i:'🏦', likes:'centrum', bonus:'+25% opslag', d:l => `Goudopslag ${GCAP[l]}`, c:[[100,0],[400,1],[1000,3]] },
  arch:  { n:'Boogschutterskamp', i:'🎯', likes:'heuvel', bonus:'boogschutters +10% schade', d:l => l ? `Train Boogschutters · +${2*l} legerplekken${l > 1 ? ` · +${(l-1)*10}% schade` : ''}` : 'Train Boogschutters, vergroot je leger', c:[[150,0],[400,2],[900,4]] },
  mine:  { n:'Goudmijn',   i:'⛏️', likes:'heuvel', bonus:'+25% goud', d:l => l ? `Delft ${l*8} goud/min (opslag ${l*240})` : 'Delft goud, ook als je weg bent', c:[[80,0],[250,1],[600,3],[1300,6]] },
  bar:   { n:'Kazerne',    i:'🏰', likes:'centrum', bonus:'+2 wachters', d:l => l ? `Leger van ${CAP[l]} wachters${l >= 2 ? ', Slopers beschikbaar' : ' (Slopers vanaf niveau 2)'}` : 'Train wachters voor strooptochten', c:[[120,0],[350,2],[800,4],[1500,7]] },
  dike:  { n:'Muur',       i:'🧱', likes:'kust', bonus:'+1 verdedigingspunt, vloed 2% trager', d:l => l ? `${4 + 2*l} verdedigingspunten${l >= 2 ? ', torens' : l >= 1 ? ', meeuwen' : ''} · vloed ${l*4}% trager · aanval +${l*5} s` : 'Meer verdedigers voor je dorp, remt de vloed af', c:[[120,0],[300,1],[650,3],[1200,6]] },
  light: { n:'Vuurtoren',  i:'🗼', likes:'kust', bonus:'+20 bereik, verder zicht', d:l => l ? `Trekt munten aan (bereik ${MAGNET[l]}) · verkent vijandige paden` : 'Trekt munten aan, verkent vijandige eilanden', c:[[100,0],[350,2],[800,4]] },
  inn:   { n:'Herberg',    i:'🏠', likes:'centrum', bonus:'+1 leven', d:l => `${3+l} levens per expeditie · wachters +${l*15}% leven`, c:[[150,0],[400,2],[900,5]] },
  shop:  { n:'Werkplaats', i:'🥾', likes:'heuvel', bonus:'wachters +10% schade', d:l => `${1+l}× springen in de lucht · wachters +${l*15}% schade`, c:[[300,3],[800,8]] },
};
const CAP = [0, 5, 8, 11, 14]; // legergrootte per Kazerne-niveau
const GCAP = [800, 2000, 4000, 8000]; // goudopslag per Bank-niveau
const goldCap = () => Math.round(GCAP[SV.b.bank]*(bonus('bank') ? 1.25 : 1));
// Goud erbij, begrensd door de opslag. Geeft terug hoeveel er echt bij kwam.
function addGold(n) { const g0 = SV.gold; SV.gold = Math.max(g0, Math.min(goldCap(), g0 + n)); return SV.gold - g0; }
// Vereisten: niets mag hoger dan het Stadhuis; het Stadhuis en de Muur vragen zelf andere gebouwen.
const HALLREQ = { 2:{ mine:1, bank:1 }, 3:{ mine:2, bank:2, bar:2 }, 4:{ mine:3, bank:3, dike:3 } };
const EXREQ = { dike:{ 3:{ bank:2, mine:2 }, 4:{ bank:3, mine:3 } } };
function missing(k, L) {
  const r = k === 'hall' ? Object.assign({}, HALLREQ[L]) : Object.assign(L > SV.b.hall ? { hall:L } : {}, (EXREQ[k] || {})[L]);
  return Object.keys(r).filter(q => SV.b[q] < r[q]).map(q => `${BLD[q].n} niveau ${r[q]}`);
}
// Bouwtijd in seconden: elk niveau duurt fors langer. Eén bouwer: één klus tegelijk.
const buildSecs = (k, L) => Math.round([15, 90, 600, 2400][L - 1]*(k === 'hall' ? 2 : 1)*(bonus('hall') ? .9 : 1));
const fmtT = t => t < 60 ? Math.ceil(t) + ' s' : t < 3600 ? Math.ceil(t/60) + ' min' : Math.floor(t/3600) + ' u ' + Math.round(t % 3600/60) + ' min';
const jobLeft = () => SV.job ? Math.max(0, (SV.job.end - Date.now())/1000) : 0;
const skipCost = () => Math.max(1, Math.ceil(jobLeft()/120));
function finishJob() { const k = SV.job.k; if (k === 'mine') { addGold(mineStock()); SV.mineT = Date.now(); } SV.b[k]++; SV.job = null; save(); }
function tickJob() { if (SV.job && Date.now() >= SV.job.end) { finishJob(); sfx('up'); return true; } return false; }
function startJob(k, plot) {
  const L = SV.b[k] + 1, c = BLD[k].c[L - 1];
  if (SV.job || !c || !canPay(c) || missing(k, L).length) { sfx('no'); return; }
  SV.gold -= c[0]; SV.pearls -= c[1]; if (plot !== undefined) SV.plots[plot] = k;
  SV.job = { k, end:Date.now() + buildSecs(k, L)*1000 }; sfx('coin'); save();
}
// Elke bouwplaats heeft terrein; een gebouw op zijn voorkeursterrein krijgt een bonus. Er is maar één heuvel.
const TERR = ['kust', 'heuvel', 'kust', 'centrum', 'centrum', 'kust', 'centrum', 'kust', 'heuvel'], TICON = { kust:'🌊', heuvel:'⛰️', centrum:'🏘️' }, MOVE_COST = 30;
const bonus = k => { const i = SV.plots.indexOf(k); return i >= 0 && SV.b[k] > 0 && TERR[i] === BLD[k].likes; };
const PLOTS = [[20,21],[50,17],[80,22],[23,50],[77,50],[50,82],[50,49],[79,78],[21,78]]; // posities in % op de kaart
const MAPSVG = `<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
  <rect width="100" height="100" fill="#2b7fc4"/>
  <path d="M8 20 Q20 2 50 6 Q84 4 94 30 Q99 55 84 70 Q72 98 46 96 Q14 98 6 66 Q0 40 8 20Z" fill="#f1dca7"/>
  <path d="M11 22 Q22 6 50 10 Q82 8 90 31 Q95 54 81 67 Q70 93 46 91 Q17 93 10 65 Q4 41 11 22Z" fill="#6dbb4a"/>
  <path d="M20 21 Q50 12 80 22 M23 50 L77 50 M21 78 Q50 88 79 78 M50 17 L50 82 M20 21 L23 50 L21 78 M80 22 L77 50 L79 78" fill="none" stroke="#e3c98a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#3f8f3a"><circle cx="36" cy="34" r="3.4"/><circle cx="65" cy="35" r="3"/><circle cx="36" cy="65" r="3"/><circle cx="64" cy="66" r="3.4"/><circle cx="12" cy="36" r="2.6"/><circle cx="89" cy="64" r="2.6"/></g>
</svg>`;
let selPlot = null, moving = null, shopMsg = '';
function mineStock() {
  const l = SV.b.mine; if (!l) return 0;
  const m = bonus('mine') ? 1.25 : 1;
  return Math.floor(Math.min(l*240*m, l*8*m*(Date.now()-SV.mineT)/60000));
}
const $ = id => document.getElementById(id);
const costTxt = c => `🪙${c[0]}${c[1] ? ' ⚪' + c[1] : ''}`;
const canPay = c => SV.gold >= c[0] && SV.pearls >= c[1];
function resHtml() { return `<span class="pill">🏆 ${SV.tr}</span><span class="pill">🪙 ${SV.gold}<small style="opacity:.6"> / ${goldCap()}</small></span><span class="pill">⚪ ${SV.pearls}</span><span class="pill">💎 ${SV.diamonds}</span>`; }
function renderDorp() {
  $('res').innerHTML = resHtml();
  let h = MAPSVG;
  PLOTS.forEach((p, i) => {
    const k = SV.plots[i], sel = selPlot === i ? ' sel' : '';
    if (k) h += `<button class="plot built${sel}" data-act="plot" data-i="${i}" style="left:${p[0]}%;top:${p[1]}%" aria-label="${BLD[k].n}">${BLD[k].i}<span class="tr">${TICON[TERR[i]]}</span><span class="lv">${SV.job && SV.job.k === k ? '🔨' : SV.b[k] + (bonus(k) ? '★' : '')}</span><span class="nm">${BLD[k].n}</span>${k === 'mine' && mineStock() > 0 ? '<span class="bub">🪙</span>' : ''}</button>`;
    else h += `<button class="plot empty${sel}" data-act="plot" data-i="${i}" style="left:${p[0]}%;top:${p[1]}%" aria-label="Lege bouwplaats, ${TERR[i]}">＋<span class="tr">${TICON[TERR[i]]}</span></button>`;
  });
  $('map').innerHTML = h;
  let s = '';
  if (moving !== null) s = `<div class="hint">Tik op de plek waar de <b>${BLD[SV.plots[moving]].n}</b> heen moet. Staat daar al iets, dan ruilen ze. Kost 🪙${MOVE_COST}.</div><button class="ghost" data-act="movecancel">Annuleer</button>`;
  else if (selPlot === null) s = `<div class="hint">Tik op een bouwplaats <b>＋</b> om te bouwen, of op een gebouw om het te verbeteren. Goud verdien je met expedities en aanvallen.<br>Terrein telt: 🌊 kust · ⛰️ heuvel · 🏘️ centrum.</div>`;
  else if (SV.plots[selPlot]) {
    const k = SV.plots[selPlot], b = BLD[k], l = SV.b[k], c = b.c[l], busy = SV.job && SV.job.k === k, miss = c ? missing(k, l + 1) : [];
    let btn;
    if (busy) btn = `<button class="${SV.diamonds >= skipCost() ? 'gem' : 'off'}" data-act="skip">Nu klaar<br>💎 <span data-skip>${skipCost()}</span></button>`;
    else if (!c) btn = `<button class="off" disabled>MAX</button>`;
    else btn = `<button class="${canPay(c) && !SV.job && !miss.length ? '' : 'off'}" data-act="up" data-k="${k}">Upgrade<br>${costTxt(c)}<br>⏱ ${fmtT(buildSecs(k, l + 1))}</button>`;
    s = `<div class="row"><div class="ico">${b.i}</div><div class="txt"><b>${b.n}</b> · niveau ${l}<small>${l ? b.d(l) : 'Nog in aanbouw'}</small>${busy ? `<small class="ok">🔨 ${l ? 'Upgrade' : 'Bouw'} klaar over <span data-timer>${fmtT(jobLeft())}</span></small>` : c ? `<small>Volgend niveau: ${b.d(l+1)}</small>` : ''}</div>${btn}</div>`;
    if (!busy && miss.length) s += `<small class="nok">🔒 Eerst nodig: ${miss.join(', ')}</small>`;
    else if (!busy && c && SV.job) s += `<small class="nok">🔨 De bouwer is bezig met ${BLD[SV.job.k].n}.</small>`;
    s += `<small class="${bonus(k) ? 'ok' : 'nok'}">${TICON[b.likes]} Voorkeur ${b.likes}: ${b.bonus} — ${bonus(k) ? 'actief ★' : 'niet actief, staat op ' + TERR[selPlot]}</small>`;
    s += `<div class="row">${k === 'mine' ? `<button class="gold" data-act="collect" style="flex:1">Innen 🪙 ${mineStock()}</button>` : ''}${k === 'bar' ? `<button data-act="leger" style="flex:1;background:#a61e4d">⚔️ Leger</button>` : ''}<button class="ghost" data-act="move" style="flex:1">Verplaats 🪙${MOVE_COST}</button></div>`;
  } else {
    const free = Object.keys(BLD).filter(k => !SV.plots.includes(k));
    if (!free.length) s = `<div class="hint">Alle gebouwen staan al. Deze plek blijft vrij.</div>`;
    if (free.length) s = `<small>Deze plek is ${TICON[TERR[selPlot]]} <b>${TERR[selPlot]}</b>. ★ = dit gebouw krijgt hier zijn bonus.</small>`;
    for (const k of free) { const b = BLD[k], c = b.c[0], fit = TERR[selPlot] === b.likes, miss = missing(k, 1);
      s += `<div class="row"><div class="ico">${b.i}</div><div class="txt"><b>${b.n}${fit ? ' ★' : ''}</b><small>${b.d(0)}</small><small class="${fit ? 'ok' : ''}">${TICON[b.likes]} ${b.likes}: ${b.bonus}</small></div><button class="${canPay(c) && !SV.job && !miss.length ? '' : 'off'}" data-act="build" data-k="${k}">Bouw hier<br>${costTxt(c)}<br>⏱ ${fmtT(buildSecs(k, 1))}</button></div>`; }
    if (free.length && SV.job) s += `<small class="nok">🔨 De bouwer is bezig met ${BLD[SV.job.k].n}.</small>`;
  }
  $('sheet').innerHTML = s;
  $('playBtn').innerHTML = '🏃 Expeditie<br>' + SV.sel;
  $('endBtn').innerHTML = '∞ Oneindig' + (SV.best ? `<br>${SV.best} m` : '');

}
function sfx(n) {

  else if (n === 'coin') tone(1250, .07, 'triangle', .07, 1700);
  else if (n === 'pearl') { tone(900, .12, 'sine', .09, 1400); setTimeout(() => tone(1400, .2, 'sine', .09, 2000), 90); }

  else if (n === 'no') tone(140, .12, 'square', .05);
  else if (n === 'bell') { tone(660, .9, 'sine', .12); tone(990, .9, 'sine', .05); setTimeout(() => { tone(660, 1.1, 'sine', .12); tone(990, 1.1, 'sine', .05); }, 380); }
}

/* ===================== Levelgenerator ===================== */
// n >= 1: vast level (deterministisch per nummer). n === 0: oneindig, wordt onderweg bijgebouwd.
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const PW = 26, PH = 40, DH = 20, GW = 16, FOE_GOLD = [5, 8]; // krab, meeuw

function newGen(n, seed) {
  return { n, r:rng(n ? n*7919 + 13 : (seed || Date.now())), x:600, y:500, pearls:0, nextPearl:2500, done:false,
    len:n ? 4600 + Math.min(n, 20)*420 : Infinity,
    blocks:[{ x:-900, y:500, w:1500 }], plats:[], coins:[], foes:[], gates:[], flagX:Infinity, flagY:0 };
}
function extend(L, until) {
  const r = L.r, n = L.n;
  while (!L.done && L.x < until) {
    if (L.x >= L.len) { // slotstuk met de klok
      L.x += 80; L.y = clamp(L.y, 420, 520);
      L.blocks.push({ x:L.x, y:L.y, w:1400 });
      if (L.pearls === 0) L.coins.push({ x:L.x + 120, y:L.y - 120, t:1 });
      L.flagX = L.x + 320; L.flagY = L.y; L.done = true; break;
    }
    const D = n ? clamp((n-1)/14, 0, 1) : clamp(L.x/26000, 0, 1);
    let x = L.x, y = L.y, dy, gap = 0;
    if (r() < .45 + .15*D) { gap = 70 + r()*(50 + 60*D); dy = (r()*2 - 1)*40; }
    else dy = (r() < .5 ? -1 : 1)*(30 + r()*40);
    let ny = clamp(y + dy, 400, 540);
    if (!gap && Math.abs(ny - y) < 24) ny = y; // geen bijna onzichtbare drempels waar je op vastloopt
    if (gap) for (let i = 1; i <= 4; i++) { const k = i/5; L.coins.push({ x:x + gap*k, y:(y + (ny-y)*k) - 30 - Math.sin(k*Math.PI)*70, t:0 }); }
    x += gap; y = ny;
    const w = 240 - 40*D + r()*360, roll = r(); let crab = false, gate = false;
    L.blocks.push({ x, y, w });
    if (w > 330 && roll < .3 + .35*D) { // krab
      const a = x + 140, b = x + w - 50; crab = true;
      L.foes.push({ k:0, x:a + r()*(b-a-30), y:y-22, w:30, h:22, a, b, vx:(40 + 40*D)*(r() < .5 ? -1 : 1), by:y-22, ph:r()*6 });
    } else if (w > 300 && roll > .72) { // sluisdeur: alleen bukkend eronderdoor
      gate = true; const gx = x + w*.55;
      L.gates.push({ x:gx, b:y - 24 });
      for (let i = -1; i <= 1; i++) L.coins.push({ x:gx + GW/2 + i*26, y:y - 12, t:0 });
    } else if (roll < .72) { // munten op de grond
      const c = 3 + Math.floor(r()*4);
      for (let i = 0; i < c && 70 + i*30 < w - 20; i++) L.coins.push({ x:x + 70 + i*30, y:y - 26, t:0 });
    }
    if (!gate && w > 260 && r() < .4) { // zwevend plankier, soms een tweede met parel
      const pw = 90 + r()*50, px = x + 60 + r()*(w - pw - 100);
      L.plats.push({ x:px, y:y - 92, w:pw });
      for (let i = 0; i < 3; i++) L.coins.push({ x:px + pw/2 + (i-1)*26, y:y - 118, t:0 });
      const pearlOk = n ? L.pearls < 3 : x > L.nextPearl;
      if (pearlOk && r() < .6 && px + pw + 110 < x + w) {
        L.plats.push({ x:px + pw + 30, y:y - 178, w:70 });
        L.coins.push({ x:px + pw + 65, y:y - 206, t:1 }); L.pearls++; L.nextPearl = x + 3500;
      }
    } else if ((n ? n >= 3 : x > 3000) && !crab && !gate && w > 340 && r() < .15 + .3*D) { // meeuw (nooit boven krab of landingszone)
      L.foes.push({ k:1, x:x + w*.6, y:y-100, w:30, h:16, a:x + 170, b:x + w - 30, vx:-(30 + 40*D), by:y - 100, ph:r()*6 });
    }
    L.x = x + w; L.y = y;
  }
}
function genLevel(n) { const L = newGen(n); extend(L, Infinity); return L; }

/* ===================== Spel ===================== */
const STEP = 1/120, GRAV = 2000, JUMP = 660, JUMP2 = 600;
const G = { mode:'dorp', n:1, t:0, bgX:0, parts:[], pops:[] };
let held = false, wantDuck = false;

function start(n, seed) {

    L, blocks:L.blocks, plats:L.plats, coins:L.coins, foes:L.foes, gates:L.gates, flagX:L.flagX, flagY:L.flagY,

    speed:n ? 220 + 5*Math.min(n, 16) : 220, fK:.93 - .04*SV.b.dike - (bonus('dike') ? .02 : 0), fMax:400 + 50*SV.b.dike,
    p:{ x:0, y:500 - PH, vy:0, ground:true, coy:0, buf:0, air:0, inv:0, stall:0, duck:false, duckT:0, jT:-9, jAir:false, gateStall:false },
  });

}
function press() { if (G.mode === 'play') { G.p.buf = .13; held = true; wantDuck = false; } }
function release() { held = false; if (G.mode === 'play' && G.p.vy < -200) G.p.vy *= .45; }
function duckOn() {

  // de tik waarmee de veeg begon gaf al een sprong: die draaien we terug

  else if (!p.ground) p.vy = Math.max(p.vy, 700); // in de lucht: snel omlaag

}
function duckOff() { wantDuck = false; }
const underGate = p => G.gates.some(g => p.x + PW > g.x && p.x < g.x + GW);

function burst(x, y, col, c) { for (let i = 0; i < c; i++) G.parts.push({ x, y, vx:(Math.random()-.5)*260, vy:-Math.random()*260, l:.5, col }); }
function pop(x, y, txt) { G.pops.push({ x, y, txt, l:1 }); }
function respawn() {
  const p = G.p, b = G.blocks.find(b => b.x + b.w > p.x + PW + 40) || G.blocks[G.blocks.length-1];
  p.x = Math.max(b.x + 12, p.x); p.y = b.y - PH; p.vy = 0; p.ground = true; p.air = G.maxAir;
}
function hurt() {
  const p = G.p; if (p.inv > 0) return;
  G.hearts--; p.inv = 1.4; sfx('hurt'); if (navigator.vibrate) navigator.vibrate(60);
  burst(p.x + PW/2, p.y + PH/2, '#e03131', 10);

const meters = () => Math.max(0, Math.floor(G.p.x/10));
function end(win, why) {

    $('eTitle').textContent = '🔔 Klok geluid!'; $('eBtn').textContent = '▶ Expeditie ' + SV.sel;
  } else if (G.n === 0) { // oneindig: alles wat je pakte is van jou

    txt = `${why}<br><b>${m} m</b>${rec ? ' — nieuw record!' : ` (record ${SV.best} m)`}<br>🪙 ${G.gold} &nbsp; ⚪ ${G.pearls}`;

function revive() {
  if (G.mode !== 'lose' || G.revived || SV.diamonds < REVIVE) { sfx('no'); return; }

function step() {

    if ((G.pruneT -= dt) <= 0) { G.pruneT = 1; const cut = p.x - 1500;
      for (const k of ['blocks', 'plats', 'coins', 'foes', 'gates']) { const a = G[k]; let i = 0; while (i < a.length && a[i].x + (a[i].w || 0) < cut) i++; if (i) a.splice(0, i); } }
  }

  if (p.buf > 0) {
    p.buf -= dt;

  }

  // munten & parels

    if (G.magnet && d2 < G.magnet*G.magnet) { const d = Math.sqrt(d2) || 1; c.x += dx/d*520*dt; c.y += dy/d*520*dt; }
    if (Math.abs(dx) < PW/2 + 10 && Math.abs(dy) < PH/2 + 10) {

function botDef(lv, seed) { // oefendorp: vast puntenbudget, ongelijk verdeeld zodat er een zwak en een zwaar pad is

async function netInit() {

}
let pushT = 0;
function netPush() { // eigen dorp delen: naam, bekers en verdediging
  if (!NET.db) return Promise.resolve();
  clearTimeout(pushT);
  return new Promise(res => { pushT = setTimeout(() => NET.db.doc('players/' + NET.id).set({ name:SV.name.slice(0, 20), tr:SV.tr, def:SV.def, ts:Date.now() }).catch(() => {}).then(res), 600); });
}

    for (const d of snap.docs) { const v = d.data() || {}, def = cleanDef(v.def); if (d.id !== NET.id && def) NET.players.push({ id:d.id, name:String(v.name || 'Onbekend dorp').slice(0, 20), tr:Math.max(0, Math.floor(+v.tr || 0)), def }); }

}

    for (const d of snap.docs) { const v = d.data() || {}, ts = +v.ts || 0, st = clamp(Math.floor(+v.stars || 0), 0, 3); if (ts <= SV.seen) continue;
      const dt = st ? -4*st : 6; SV.tr = Math.max(0, SV.tr + dt); SV.log.unshift({ name:String(v.name || 'Onbekend dorp').slice(0, 20), stars:st, dt, ts }); seen = Math.max(seen, ts); }
    if (seen !== SV.seen) { SV.seen = seen; SV.log = SV.log.sort((a, b) => b.ts - a.ts).slice(0, 8); save(); netPush(); }
  } catch (e) {}
}
function netAttack(target, stars) { if (NET.db && target.id) NET.db.collection('attacks').add({ to:target.id, from:NET.id, name:SV.name.slice(0, 20), stars, ts:Date.now() }).catch(() => {}); }

let R = null;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5), w = innerWidth, h = innerHeight;
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  const s = Math.min(h/640, w/420); S = s*dpr; W = w/s; H = h/s; OY = H*.72 - 540;
}
addEventListener('resize', resize); resize();

// Dezelfde munt (🪙) en parel (⚪) als in het dorp en de winkel, één keer voorgetekend.
function sprite(ch) { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d'); x.font = '48px system-ui, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji"'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(ch, 32, 35); return c; }
const SPR = { coin:sprite('🪙'), pearl:sprite('⚪') };

const SKY = [['#8fd3ff','#e8f7ff'], ['#ffb37a','#ffe9c9'], ['#6fa8dc','#d9ecff'], ['#5b5fa8','#f3b6a0']];
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }

function drawBg(cam) {
  const pal = SKY[(Math.max(1, G.n)-1) % SKY.length], g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, pal[0]); g.addColorStop(.75, pal[1]); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff8'; ctx.beginPath(); ctx.arc(W*.78, OY + 190, 34, 0, 7); ctx.fill();
  ctx.fillStyle = '#fffc';
  for (let i = 0; i < 6; i++) { const x = ((i*310 - cam*.08) % (W + 300) + W + 300) % (W + 300) - 150, y = OY + 150 + (i*53 % 120); rr(x, y, 90, 22, 11); ctx.fill(); rr(x + 22, y - 12, 46, 22, 11); ctx.fill(); }
  ctx.fillStyle = '#7fbf7f'; ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W + 16; x += 16) { const wx = x + cam*.2; ctx.lineTo(x, OY + 440 + Math.sin(wx*.006)*26 + Math.sin(wx*.017)*10); }
  ctx.lineTo(W, H); ctx.fill();
  const sp = 520, off = cam*.35, i0 = Math.floor(off/sp);
  for (let i = i0; i <= i0 + Math.ceil(W/sp) + 1; i++) { // molens
    const x = i*sp - off + 120, y = OY + 455;
    ctx.fillStyle = '#6b4f3a'; ctx.beginPath(); ctx.moveTo(x - 14, y); ctx.lineTo(x - 8, y - 60); ctx.lineTo(x + 8, y - 60); ctx.lineTo(x + 14, y); ctx.fill();
    ctx.save(); ctx.translate(x, y - 58); ctx.rotate(G.t*.8 + i); ctx.fillStyle = '#f4ead5';
    for (let k = 0; k < 4; k++) { ctx.rotate(Math.PI/2); ctx.fillRect(-3, 0, 6, 44); ctx.fillRect(3, 10, 8, 32); }
    ctx.restore();
  }
  ctx.fillStyle = '#5da35d'; ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W + 16; x += 16) { const wx = x + cam*.35; ctx.lineTo(x, OY + 470 + Math.sin(wx*.009 + 2)*16); }
  ctx.lineTo(W, H); ctx.fill();
}
function drawWater(cam) {
  ctx.fillStyle = '#2b7fc4'; ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W + 12; x += 12) ctx.lineTo(x, OY + 585 + Math.sin((x + cam)*.03 + G.t*2.5)*5);
  ctx.lineTo(W, H); ctx.fill();
}
function drawHero(x, y, p) {
  if (p.inv > 0 && Math.floor(G.t*14) % 2) return;
  if (p.duck) { // gebukt: plat tegen de grond
    ctx.fillStyle = '#28435e'; ctx.fillRect(x - 2, y + 34, 8, 6);
    ctx.fillStyle = '#ffc928'; rr(x, y + 24, 22, 16, 6); ctx.fill();
    ctx.fillStyle = '#f3c9a5'; rr(x + 14, y + 23, 15, 12, 5); ctx.fill();
    ctx.fillStyle = '#e0a800'; rr(x + 11, y + 20, 21, 6, 3); ctx.fill();
    ctx.fillStyle = '#10263b'; ctx.fillRect(x + 24, y + 28, 3, 3);
    return;
  }
  const run = p.ground ? Math.sin(G.t*18) : .6;
  ctx.fillStyle = '#28435e'; ctx.fillRect(x + 5 + run*4, y + 31, 6, 9); ctx.fillRect(x + 15 - run*4, y + 31, 6, 9);
  ctx.fillStyle = '#ffc928'; rr(x + 1, y + 13, 24, 21, 6); ctx.fill();
  ctx.fillStyle = '#f3c9a5'; rr(x + 5, y + 3, 18, 14, 6); ctx.fill();
  ctx.fillStyle = '#e0a800'; rr(x - 1, y + 2, 26, 6, 3); ctx.fill(); rr(x + 4, y - 3, 17, 8, 5); ctx.fill();
  ctx.fillStyle = '#10263b'; ctx.fillRect(x + 18, y + 9, 3, 3);
}
function drawFoe(f, cam) {
  const x = f.x - cam, y = f.y + OY;
  if (f.k === 0) {
    const wg = Math.sin(G.t*12 + f.ph)*2;
    ctx.strokeStyle = '#a61e1e'; ctx.lineWidth = 2.5; ctx.beginPath();
    for (let i = 0; i < 3; i++) { ctx.moveTo(x + 5 + i*4, y + 16); ctx.lineTo(x + 1 + i*4, y + 22 + (i%2 ? wg : -wg)*.5); ctx.moveTo(x + 25 - i*4, y + 16); ctx.lineTo(x + 29 - i*4, y + 22 + (i%2 ? -wg : wg)*.5); }
    ctx.stroke();
    ctx.fillStyle = '#e03131'; ctx.beginPath(); ctx.ellipse(x + 15, y + 12, 14, 9, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 1, y + 5 + wg, 5, 0, 7); ctx.arc(x + 29, y + 5 - wg, 5, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(x + 9, y + 1, 4, 6); ctx.fillRect(x + 17, y + 1, 4, 6);
    ctx.fillStyle = '#000'; ctx.fillRect(x + 10, y + 2, 2, 3); ctx.fillRect(x + 18, y + 2, 2, 3);
  } else {
    const fl = Math.sin(G.t*10 + f.ph)*9;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#55657a'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(x + 15, y + 9, 12, 6, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 8, y + 7); ctx.lineTo(x + 15, y - 4 + fl); ctx.lineTo(x + 22, y + 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#f59f00'; ctx.beginPath(); ctx.moveTo(x + 1, y + 7); ctx.lineTo(x - 6, y + 10); ctx.lineTo(x + 2, y + 11); ctx.fill();
    ctx.fillStyle = '#000'; ctx.fillRect(x + 6, y + 6, 2, 2);
  }
}
function drawWorld(cam) {
  drawWater(cam);
  for (const b of G.blocks) {
    const x = b.x - cam; if (x > W || x + b.w < 0) continue; const y = b.y + OY;
    ctx.fillStyle = '#7a5236'; ctx.fillRect(x, y, b.w, H - y);
    ctx.fillStyle = '#684428'; ctx.fillRect(x, y, 4, H - y); ctx.fillRect(x + b.w - 4, y, 4, H - y);
    ctx.fillStyle = '#5fae3b'; rr(x - 2, y - 2, b.w + 4, 14, 5); ctx.fill();
    ctx.fillStyle = '#4c9130'; ctx.fillRect(x, y + 9, b.w, 3);
  }
  for (const s of G.plats) {
    const x = s.x - cam; if (x > W || x + s.w < 0) continue;
    ctx.fillStyle = '#b0793f'; rr(x, s.y + OY, s.w, 12, 3); ctx.fill();
    ctx.fillStyle = '#8a5a2b'; ctx.fillRect(x + 3, s.y + OY + 8, s.w - 6, 3);
  }
  for (const g of G.gates) { // sluisdeur die uit de lucht hangt
    const x = g.x - cam; if (x > W || x + GW < 0) continue; const b = g.b + OY;
    ctx.fillStyle = '#55657a'; ctx.fillRect(x + GW/2 - 1.5, 0, 3, b - 150);
    ctx.fillStyle = '#8a5a2b'; rr(x, b - 150, GW, 150, 3); ctx.fill();
    ctx.fillStyle = '#6b4320'; for (let y = b - 138; y < b - 20; y += 22) ctx.fillRect(x, y, GW, 3);
    for (let i = 0; i < 4; i++) { ctx.fillStyle = i % 2 ? '#fff' : '#e03131'; ctx.fillRect(x + i*GW/4, b - 12, GW/4, 12); }
  }
  if (G.flagX < Infinity) { // klokkentoren (finish)
    const fx = G.flagX - cam + 30, fy = G.flagY + OY;
    if (fx < W + 80) {
      ctx.fillStyle = '#8d6e63'; ctx.fillRect(fx - 4, fy - 130, 8, 130); ctx.fillRect(fx + 44, fy - 130, 8, 130); ctx.fillRect(fx - 12, fy - 138, 72, 10);
      ctx.fillStyle = '#c62828'; ctx.beginPath(); ctx.moveTo(fx - 16, fy - 138); ctx.lineTo(fx + 24, fy - 168); ctx.lineTo(fx + 64, fy - 138); ctx.fill();
      ctx.save(); ctx.translate(fx + 24, fy - 126); ctx.rotate(Math.sin(G.t*5)*(G.mode === 'win' ? .5 : .08));
      ctx.fillStyle = '#f2a900'; ctx.beginPath(); ctx.moveTo(-14, 30); ctx.quadraticCurveTo(-12, 0, 0, 0); ctx.quadraticCurveTo(12, 0, 14, 30); ctx.fill(); ctx.beginPath(); ctx.arc(0, 33, 4, 0, 7); ctx.fill();
      ctx.restore();
    }
  }
  for (const c of G.coins) {
    const x = c.x - cam; if (x > W + 20 || x < -20) continue; const y = c.y + OY + Math.sin(G.t*4 + c.x*.05)*3;
    if (c.t) { ctx.fillStyle = '#ffffff66'; ctx.beginPath(); ctx.arc(x, y, 15, 0, 7); ctx.fill(); ctx.drawImage(SPR.pearl, x - 12, y - 12, 24, 24); }
    else ctx.drawImage(SPR.coin, x - 11, y - 11, 22, 22);
  }
  for (const f of G.foes) if (!f.dead && f.x - cam < W + 40 && f.x - cam > -40) drawFoe(f, cam);
  drawHero(G.p.x - cam, G.p.y + OY, G.p);
  for (const q of G.parts) { ctx.fillStyle = q.col; ctx.globalAlpha = Math.max(0, q.l*2); ctx.fillRect(q.x - cam - 2, q.y + OY - 2, 4, 4); }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = 'bold 17px system-ui';
  for (const q of G.pops) { ctx.globalAlpha = Math.min(1, q.l*2); ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.strokeText(q.txt, q.x - cam, q.y + OY); ctx.fillStyle = '#8a5a00'; ctx.fillText(q.txt, q.x - cam, q.y + OY); }
  ctx.globalAlpha = 1;
  const wx = G.floodX - cam; // vloedgolf
  if (wx > -30) {
    const edge = y => wx + Math.sin(y*.035 + G.t*5)*9 + Math.sin(y*.011 - G.t*2)*8;
    ctx.fillStyle = 'rgba(28,104,184,.86)'; ctx.beginPath(); ctx.moveTo(-10, 0);
    for (let y = 0; y <= H + 14; y += 14) ctx.lineTo(edge(y), y);
    ctx.lineTo(-10, H); ctx.fill();
    ctx.strokeStyle = '#eaf6ff'; ctx.lineWidth = 4; ctx.beginPath();
    for (let y = 0; y <= H + 14; y += 14) ctx.lineTo(edge(y), y);
    ctx.stroke();
  }
}
function drawHud() {
  const p = G.p, dist = p.x - G.floodX, danger = clamp(1 - (dist - 60)/(G.fMax - 60), 0, 1);
  if (danger > .35) { ctx.fillStyle = `rgba(28,104,184,${(danger - .35)*.9*(.7 + .3*Math.sin(G.t*10))})`; ctx.fillRect(0, 0, 14 + danger*26, H); }
  const bx = 16, bw = W - 32, by = 18;
  ctx.textBaseline = 'middle';
  if (G.n === 0) { // oneindig: afstand i.p.v. voortgang
    ctx.fillStyle = '#0b1c2c99'; rr(bx - 4, by - 8, bw + 8, 26, 13); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 15px system-ui'; ctx.textAlign = 'left'; ctx.fillText('∞  ' + meters() + ' m', bx + 8, by + 5);
    ctx.textAlign = 'right'; ctx.font = '13px system-ui'; ctx.fillText('record ' + Math.max(SV.best, meters()) + ' m', bx + bw - 8, by + 5);
  } else { // voortgangsbalk = de vloedklok
    const k = v => bx + clamp(v/G.flagX, 0, 1)*bw;
    ctx.fillStyle = '#0b1c2c99'; rr(bx - 4, by - 4, bw + 8, 18, 9); ctx.fill();
    ctx.fillStyle = '#2b7fc4'; rr(bx, by, Math.max(4, k(G.floodX) - bx), 10, 5); ctx.fill();
    ctx.fillStyle = '#ffc928'; ctx.beginPath(); ctx.arc(k(p.x), by + 5, 7, 0, 7); ctx.fill();
    ctx.font = '16px system-ui'; ctx.textAlign = 'right'; ctx.fillText('🔔', bx + bw + 6, by + 5);
  }
  ctx.textAlign = 'left'; ctx.font = '18px system-ui'; let hs = ''; for (let i = 0; i < G.hearts; i++) hs += '❤️'; ctx.fillText(hs, 14, 54);
  ctx.font = 'bold 18px system-ui'; ctx.textAlign = 'right'; ctx.fillStyle = '#10263b';
  ctx.fillText(`🪙 ${G.gold}   ⚪ ${G.pearls}`, W - 14, 54);
  ctx.textAlign = 'center';
  if (G.n) { ctx.font = 'bold 13px system-ui'; ctx.fillStyle = '#10263bcc'; ctx.fillText('Expeditie ' + G.n, W/2, 54); }
  if (G.n <= 1 && G.t < 7 && G.mode === 'play') {
    ctx.fillStyle = '#0b1c2ccc'; rr(W/2 - 175, OY + 185, 350, 80, 12); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 15px system-ui'; ctx.fillText('Tik = springen · vasthouden = hoger', W/2, OY + 204);
    ctx.fillText('Veeg omlaag = bukken onder sluisdeuren', W/2, OY + 226);
    ctx.font = '14px system-ui'; ctx.fillText('Tik in de lucht = dubbelsprong · spring op krabben', W/2, OY + 248);
  }
  if (p.stall > .15 && Math.floor(G.t*6) % 2) { ctx.fillStyle = '#c92a2a'; ctx.font = 'bold 22px system-ui'; ctx.fillText(p.gateStall ? 'BUK!  ↓ veeg omlaag' : 'SPRING!', W/2, OY + 300); }
}
function draw() {
  ctx.setTransform(S, 0, 0, S, 0, 0);
  if (G.mode === 'raid' || G.mode === 'raidEnd') return drawRaid();
  if (G.mode === 'dorp') { drawBg(G.bgX); ctx.fillStyle = '#2b7fc4'; ctx.fillRect(0, OY + 520, W, H); return; }
  const cam = G.p.x - W*.25;
  drawBg(cam); drawWorld(cam); drawHud();
}

/* ===================== Lus & invoer ===================== */
let last = 0, acc = 0;
function frame(t) {
  const dt = Math.min(.05, (t - last)/1000 || 0); last = t;
  if (G.mode === 'play') { acc += dt; while (acc >= STEP && G.mode === 'play') { step(); acc -= STEP; } }
  else if (G.mode === 'raid') { acc += dt; while (acc >= 1/60 && G.mode === 'raid') { raidStep(1/60); acc -= 1/60; } }
  else { acc = 0; G.t += dt; G.bgX += dt*25; }
  draw(); requestAnimationFrame(frame);
}
// Eén duim: tik = springen, vasthouden = hoger, omlaag vegen (en vasthouden) = bukken.
let pid = null, py0 = 0;
cv.addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); if (G.mode === 'raid') return deploy(clamp(Math.floor(e.clientX/innerWidth*3), 0, 2)); pid = e.pointerId; py0 = e.clientY; press(); });
addEventListener('pointermove', e => { if (e.pointerId === pid && e.clientY - py0 > 22) duckOn(); });
function up(e) { if (e.pointerId !== pid) return; pid = null; duckOff(); release(); }
addEventListener('pointerup', up); addEventListener('pointercancel', up);
addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); audioInit(); press(); }
  else if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); duckOn(); }
});
addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'ArrowUp') release(); else if (e.code === 'ArrowDown' || e.code === 'KeyS') duckOff(); });
addEventListener('contextmenu', e => e.preventDefault());

window.VK = { G, get SV() { return SV; }, start, step, press, release, duckOn, duckOff, genLevel, genRaid, missing, buildSecs, tickJob, goldCap, botDef, layout, NET, curTarget, startRaid, deploy, raidStep, endRaid, get R() { return R; } };
tickJob(); goDorp(); requestAnimationFrame(frame); netInit();
</script>
