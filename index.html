<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#16324f">
<title>Vloedklok</title>
<style>
  :root { --ink:#10263b; --panel:#fdf6e3; --accent:#f2a900; --go:#2f9e44; --no:#9aa5b1; --dark:#0b1c2c; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:#16324f; color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none; touch-action:none; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .screen { position:fixed; inset:0; display:none; flex-direction:column; align-items:center;
    padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom)); }
  .screen.on { display:flex; }
  #dorp, #winkel { background:rgba(16,38,59,.55); }
  .wrap { width:100%; max-width:460px; display:flex; flex-direction:column; min-height:0; flex:1; gap:8px; }
  .top { display:flex; align-items:center; gap:8px; }
  h1 { margin:0; flex:1; color:#fff; font-size:26px; letter-spacing:1px; text-shadow:0 2px 0 #0008; }
  .res { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }
  .pill { background:var(--dark); color:#fff; border-radius:999px; padding:6px 12px; font-weight:700; font-size:15px; }
  button { font:inherit; border:0; border-radius:12px; font-weight:800; color:#fff; background:var(--go);
    min-height:48px; padding:6px 12px; box-shadow:0 3px 0 #0005; touch-action:manipulation; }
  button:active { transform:translateY(2px); box-shadow:0 1px 0 #0005; }
  button.off { background:var(--no); }
  button.gold { background:var(--accent); color:#3b2a00; }
  button.ghost { background:var(--dark); }
  button.gem { background:#3b5bdb; }
  .top button { min-height:42px; }

  /* dorpskaart met bouwplaatsen */
  .map { position:relative; flex:1; min-height:230px; border-radius:18px; overflow:hidden; background:#2b7fc4; box-shadow:0 3px 0 #0004; }
  .map svg { position:absolute; inset:0; width:100%; height:100%; }
  .plot { position:absolute; transform:translate(-50%,-50%); width:64px; height:64px; min-height:0; padding:0; border-radius:50%;
    font-size:30px; line-height:1; box-shadow:0 4px 0 #0004; }
  .plot:active { transform:translate(-50%,-48%); }
  .plot.empty { background:#ffffff40; border:3px dashed #fff; color:#fff; font-size:28px; }
  .plot.built { background:var(--panel); border:3px solid #8a5a2b; }
  .plot.sel { outline:4px solid var(--accent); outline-offset:2px; }
  .plot .lv { position:absolute; right:-6px; bottom:-4px; background:var(--dark); color:#fff; font-size:11px; border-radius:999px; padding:3px 6px; }
  .plot .nm { position:absolute; left:50%; top:100%; transform:translateX(-50%); margin-top:4px; white-space:nowrap; font-size:11px; color:#fff;
    background:#0b1c2cb0; border-radius:6px; padding:1px 6px; }
  .plot .bub { position:absolute; left:50%; top:-16px; transform:translateX(-50%); font-size:18px; animation:bob 1s infinite alternate; }
  @keyframes bob { to { margin-top:-5px; } }
  @media (prefers-reduced-motion: reduce) { .plot .bub { animation:none; } }

  .sheet { background:var(--panel); border-radius:14px; padding:10px 12px; min-height:84px; max-height:34vh; overflow-y:auto; touch-action:pan-y;
    display:flex; flex-direction:column; gap:8px; box-shadow:0 3px 0 #0004; }
  .row { display:flex; align-items:center; gap:10px; }
  .row .ico { font-size:28px; width:36px; text-align:center; }
  .row .txt { flex:1; min-width:0; }
  .row b { font-size:15.5px; }
  .row small { display:block; color:#4b5b6b; font-size:12.5px; line-height:1.3; }
  .row button { min-width:92px; font-size:13.5px; line-height:1.25; }
  .hint { color:#4b5b6b; font-size:14px; text-align:center; margin:auto 0; }
  .bar { display:flex; gap:8px; align-items:stretch; }
  .bar .big { flex:1; font-size:19px; min-height:62px; }
  .bar .sq { width:52px; font-size:22px; }
  .list { flex:1; min-height:0; overflow-y:auto; touch-action:pan-y; display:flex; flex-direction:column; gap:8px; }
  .card { background:var(--panel); border-radius:14px; padding:10px 12px; box-shadow:0 3px 0 #0004; }
  h3 { margin:6px 0 0; color:#fff; font-size:15px; }
  .note { background:#fff3bf; color:#5c3c00; border-radius:10px; padding:8px 10px; font-size:13px; line-height:1.35; }
  #eind { justify-content:flex-end; background:rgba(16,38,59,.6); }
  #eind .box { background:var(--panel); border-radius:18px; padding:18px; width:100%; max-width:460px; text-align:center; }
  #eind h2 { margin:0 0 6px; font-size:26px; }
  #eind p { margin:4px 0 14px; font-size:16px; line-height:1.5; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="dorp" class="screen">
  <div class="wrap">
    <div class="top">
      <h1>VLOEDKLOK</h1>
      <button class="gem" data-act="shop">🛒 Winkel</button>
      <button class="ghost" data-act="mute" id="muteBtn" aria-label="Geluid"></button>
    </div>
    <div class="res" id="res"></div>
    <div class="map" id="map"></div>
    <div class="sheet" id="sheet"></div>
    <div class="bar">
      <button class="sq ghost" data-act="prev" aria-label="Vorige expeditie">‹</button>
      <button class="big" data-act="play" id="playBtn"></button>
      <button class="sq ghost" data-act="next" aria-label="Volgende expeditie">›</button>
      <button class="ghost" data-act="endless" id="endBtn" style="font-size:13px;line-height:1.2"></button>
    </div>
  </div>
</div>

<div id="winkel" class="screen">
  <div class="wrap">
    <div class="top"><h1>WINKEL</h1><button class="ghost" data-act="home">✕ Dorp</button></div>
    <div class="res" id="res2"></div>
    <div class="list" id="shopList"></div>
  </div>
</div>

<div id="eind" class="screen">
  <div class="box">
    <h2 id="eTitle"></h2>
    <p id="eText"></p>
    <div class="bar">
      <button class="ghost" data-act="home" style="flex:1">Dorp</button>
      <button class="gem" data-act="revive" id="revBtn" style="flex:1"></button>
      <button class="big" data-act="again" id="eBtn"></button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ===================== Opslag ===================== */
const KEY = 'vloedklok.v1';
const DEV = /[?&]dev=1/.test(location.search);
const DEF = { gold:0, pearls:0, diamonds:0, max:1, sel:1, best:0, b:{inn:0,shop:0,dike:0,light:0,mine:0},
  plots:[null,null,null,null,null,null], mineT:Date.now(), mute:false };
function loadSave() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  const v = JSON.parse(JSON.stringify(DEF));
  if (s && s.b) { Object.assign(v, s); v.b = Object.assign({}, DEF.b, s.b); v.plots = (s.plots || DEF.plots).slice(0, 6); while (v.plots.length < 6) v.plots.push(null); }
  for (const k in v.b) if (v.b[k] > 0 && !v.plots.includes(k)) { const i = v.plots.indexOf(null); if (i >= 0) v.plots[i] = k; } // oude saves een plek geven
  return v;
}
let SV = loadSave();
function save() { try { localStorage.setItem(KEY, JSON.stringify(SV)); } catch (e) {} }

/* ===================== Dorp: gebouwen op bouwplaatsen ===================== */
const MAGNET = [0, 70, 110, 150];
// c = kosten per niveau: [goud, parels]
const BLD = {
  mine:  { n:'Goudmijn',   i:'⛏️', d:l => l ? `Delft ${l*8} goud/min (opslag ${l*240})` : 'Delft goud, ook als je weg bent', c:[[80,0],[250,1],[600,3],[1300,6]] },
  dike:  { n:'Dijk',       i:'🧱', d:l => l ? `Vloed ${l*4}% trager, meer voorsprong` : 'Remt de vloed af', c:[[120,0],[300,1],[650,3],[1200,6]] },
  light: { n:'Vuurtoren',  i:'🗼', d:l => l ? `Trekt munten aan (bereik ${MAGNET[l]})` : 'Trekt munten naar je toe', c:[[100,0],[350,2],[800,4]] },
  inn:   { n:'Herberg',    i:'🏠', d:l => `${3+l} levens per expeditie`, c:[[150,0],[400,2],[900,5]] },
  shop:  { n:'Werkplaats', i:'🥾', d:l => `${1+l}× springen in de lucht`, c:[[300,3],[800,8]] },
};
const PLOTS = [[20,24],[54,17],[81,36],[27,60],[63,57],[46,84]]; // posities in % op de kaart
const MAPSVG = `<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
  <rect width="100" height="100" fill="#2b7fc4"/>
  <path d="M8 20 Q20 2 50 6 Q84 4 94 30 Q99 55 84 70 Q72 98 46 96 Q14 98 6 66 Q0 40 8 20Z" fill="#f1dca7"/>
  <path d="M11 22 Q22 6 50 10 Q82 8 90 31 Q95 54 81 67 Q70 93 46 91 Q17 93 10 65 Q4 41 11 22Z" fill="#6dbb4a"/>
  <path d="M20 24 Q38 14 54 17 Q72 22 81 36 Q76 50 63 57 Q46 62 27 60 Q30 74 46 84" fill="none" stroke="#e3c98a" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M27 60 Q20 42 20 24 M63 57 Q56 72 46 84" fill="none" stroke="#e3c98a" stroke-width="3" stroke-linecap="round"/>
  <g fill="#3f8f3a"><circle cx="38" cy="34" r="4"/><circle cx="43" cy="38" r="3.4"/><circle cx="70" cy="76" r="3.6"/><circle cx="14" cy="44" r="3.2"/><circle cx="84" cy="54" r="3"/><circle cx="48" cy="45" r="3"/></g>
</svg>`;
let selPlot = null, shopMsg = '';
function mineStock() {
  const l = SV.b.mine; if (!l) return 0;
  return Math.floor(Math.min(l*240, l*8*(Date.now()-SV.mineT)/60000));
}
const $ = id => document.getElementById(id);
const costTxt = c => `🪙${c[0]}${c[1] ? ' ⚪' + c[1] : ''}`;
const canPay = c => SV.gold >= c[0] && SV.pearls >= c[1];
function resHtml() { return `<span class="pill">🪙 ${SV.gold}</span><span class="pill">⚪ ${SV.pearls}</span><span class="pill">💎 ${SV.diamonds}</span>`; }
function renderDorp() {
  $('res').innerHTML = resHtml();
  let h = MAPSVG;
  PLOTS.forEach((p, i) => {
    const k = SV.plots[i], sel = selPlot === i ? ' sel' : '';
    if (k) h += `<button class="plot built${sel}" data-act="plot" data-i="${i}" style="left:${p[0]}%;top:${p[1]}%" aria-label="${BLD[k].n}">${BLD[k].i}<span class="lv">${SV.b[k]}</span><span class="nm">${BLD[k].n}</span>${k === 'mine' && mineStock() > 0 ? '<span class="bub">🪙</span>' : ''}</button>`;
    else h += `<button class="plot empty${sel}" data-act="plot" data-i="${i}" style="left:${p[0]}%;top:${p[1]}%" aria-label="Lege bouwplaats">＋</button>`;
  });
  $('map').innerHTML = h;
  let s = '';
  if (selPlot === null) s = `<div class="hint">Tik op een bouwplaats <b>＋</b> om te bouwen, of op een gebouw om het te verbeteren.</div>`;
  else if (SV.plots[selPlot]) {
    const k = SV.plots[selPlot], b = BLD[k], l = SV.b[k], c = b.c[l];
    s = `<div class="row"><div class="ico">${b.i}</div><div class="txt"><b>${b.n}</b> · niveau ${l}<small>${b.d(l)}</small>${c ? `<small>Volgend niveau: ${b.d(l+1)}</small>` : ''}</div>` +
        (c ? `<button class="${canPay(c) ? '' : 'off'}" data-act="up" data-k="${k}">Upgrade<br>${costTxt(c)}</button>` : `<button class="off" disabled>MAX</button>`) + `</div>`;
    if (k === 'mine') s += `<button class="gold" data-act="collect">Goud innen: 🪙 ${mineStock()}</button>`;
  } else {
    const free = Object.keys(BLD).filter(k => !SV.plots.includes(k));
    if (!free.length) s = `<div class="hint">Alle gebouwen staan al. Deze plek blijft vrij.</div>`;
    for (const k of free) { const b = BLD[k], c = b.c[0];
      s += `<div class="row"><div class="ico">${b.i}</div><div class="txt"><b>${b.n}</b><small>${b.d(0)}</small></div><button class="${canPay(c) ? '' : 'off'}" data-act="build" data-k="${k}">Bouw hier<br>${costTxt(c)}</button></div>`; }
  }
  $('sheet').innerHTML = s;
  $('playBtn').textContent = '▶ Expeditie ' + SV.sel;
  $('endBtn').innerHTML = '∞ Oneindig' + (SV.best ? `<br>record ${SV.best} m` : '');
  $('muteBtn').textContent = SV.mute ? '🔇' : '🔊';
}
function show(id) { for (const s of document.querySelectorAll('.screen')) s.classList.toggle('on', s.id === id); }
function goDorp() { G.mode = 'dorp'; renderDorp(); show('dorp'); }

/* ===================== Winkel & diamanten ===================== */
// Betaaladapter. ECHTE betalingen zijn NIET gekoppeld: vervang PAY.buy door Play Billing / StoreKit / Stripe
// met bonverificatie op een server. Alleen met ?dev=1 worden aankopen gesimuleerd om de winkel te testen.
const PAY = { buy(pack) { return DEV ? Promise.resolve(pack) : Promise.reject(new Error('Betalen is nog niet gekoppeld. Er is niets afgeschreven.')); } };
const PACKS = [ { id:'d80', n:'Handje diamanten', q:80, price:'€ 0,99' }, { id:'d500', n:'Zak diamanten', q:500, price:'€ 4,99' }, { id:'d1200', n:'Kist diamanten', q:1200, price:'€ 9,99' } ];
const DEALS = [ { id:'g1', n:'Buidel goud', i:'🪙', d:'400 goud', cost:10, give:() => SV.gold += 400 },
                { id:'g2', n:'Schatkist', i:'🧰', d:'2000 goud', cost:40, give:() => SV.gold += 2000 },
                { id:'p1', n:'Parelsnoer', i:'⚪', d:'5 parels', cost:15, give:() => SV.pearls += 5 } ];
const REVIVE = 5;
function renderShop() {
  $('res2').innerHTML = resHtml();
  let h = `<h3>Besteed diamanten</h3>`;
  for (const d of DEALS) h += `<div class="card row"><div class="ico">${d.i}</div><div class="txt"><b>${d.n}</b><small>${d.d}</small></div><button class="${SV.diamonds >= d.cost ? 'gem' : 'off'}" data-act="spend" data-id="${d.id}">💎 ${d.cost}</button></div>`;
  h += `<div class="card row"><div class="ico">💖</div><div class="txt"><b>Tweede kans</b><small>Na een verloren expeditie verdergaan. Eén keer per expeditie, te kiezen op het eindscherm.</small></div><button class="off" disabled>💎 ${REVIVE}</button></div>`;
  h += `<h3>Diamanten kopen</h3><div class="note">${DEV ? 'TESTMODUS: aankopen worden gesimuleerd, er wordt niets betaald.' : 'Betalen met echt geld is nog niet actief. Je verdient 💎 1 voor elke expeditie die je voor het eerst haalt.'}${shopMsg ? '<br><b>' + shopMsg + '</b>' : ''}</div>`;
  for (const p of PACKS) h += `<div class="card row"><div class="ico">💎</div><div class="txt"><b>${p.n}</b><small>${p.q} diamanten</small></div><button class="gold" data-act="buy" data-id="${p.id}">${p.price}</button></div>`;
  $('shopList').innerHTML = h;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  audioInit();
  const a = t.dataset.act, k = t.dataset.k;
  if (a === 'plot') { const i = +t.dataset.i; selPlot = selPlot === i ? null : i; renderDorp(); }
  else if (a === 'build') {
    const c = BLD[k].c[0];
    if (selPlot !== null && !SV.plots[selPlot] && !SV.plots.includes(k) && canPay(c)) {
      SV.gold -= c[0]; SV.pearls -= c[1]; SV.b[k] = 1; SV.plots[selPlot] = k; if (k === 'mine') SV.mineT = Date.now(); sfx('up'); save();
    } else sfx('no');
    renderDorp();
  } else if (a === 'up') {
    const c = BLD[k].c[SV.b[k]];
    if (c && canPay(c)) {
      if (k === 'mine') { SV.gold += mineStock(); SV.mineT = Date.now(); }
      SV.gold -= c[0]; SV.pearls -= c[1]; SV.b[k]++; sfx('up'); save();
    } else sfx('no');
    renderDorp();
  } else if (a === 'collect') { const st = mineStock(); if (st) { SV.gold += st; SV.mineT = Date.now(); sfx('coin'); save(); } renderDorp(); }
  else if (a === 'prev') { SV.sel = Math.max(1, SV.sel-1); renderDorp(); }
  else if (a === 'next') { SV.sel = Math.min(SV.max, SV.sel+1); renderDorp(); }
  else if (a === 'mute') { SV.mute = !SV.mute; save(); renderDorp(); }
  else if (a === 'play') start(SV.sel);
  else if (a === 'endless') start(0);
  else if (a === 'home') goDorp();
  else if (a === 'again') start(G.n === 0 ? 0 : G.mode === 'win' ? SV.sel : G.n);
  else if (a === 'revive') revive();
  else if (a === 'shop') { shopMsg = ''; G.mode = 'dorp'; renderShop(); show('winkel'); }
  else if (a === 'spend') {
    const d = DEALS.find(d => d.id === t.dataset.id);
    if (d && SV.diamonds >= d.cost) { SV.diamonds -= d.cost; d.give(); sfx('up'); save(); } else sfx('no');
    renderShop();
  } else if (a === 'buy') {
    const p = PACKS.find(p => p.id === t.dataset.id);
    PAY.buy(p).then(() => { SV.diamonds += p.q; save(); sfx('pearl'); shopMsg = `+${p.q} diamanten`; renderShop(); })
              .catch(err => { sfx('no'); shopMsg = err.message; renderShop(); });
  }
});
setInterval(() => { if (G.mode === 'dorp' && SV.b.mine && $('dorp').classList.contains('on')) renderDorp(); }, 5000);

/* ===================== Geluid ===================== */
let AC = null;
function audioInit() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); }
function tone(f, d, type, v, slide) {
  if (!AC || SV.mute) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t+d);
  g.gain.setValueAtTime(v || .06, t); g.gain.exponentialRampToValueAtTime(.0001, t+d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d);
}
function sfx(n) {
  if (n === 'jump') tone(380, .12, 'square', .04, 620);
  else if (n === 'jump2') tone(520, .12, 'square', .04, 840);
  else if (n === 'duck') tone(300, .1, 'triangle', .05, 150);
  else if (n === 'coin') tone(1250, .07, 'triangle', .07, 1700);
  else if (n === 'pearl') { tone(900, .12, 'sine', .09, 1400); setTimeout(() => tone(1400, .2, 'sine', .09, 2000), 90); }
  else if (n === 'stomp') { tone(240, .12, 'sawtooth', .06, 90); setTimeout(() => tone(1250, .07, 'triangle', .07, 1700), 70); }
  else if (n === 'hurt') tone(180, .25, 'sawtooth', .08, 60);
  else if (n === 'up') { tone(520, .1, 'triangle', .08); setTimeout(() => tone(780, .18, 'triangle', .08), 100); }
  else if (n === 'no') tone(140, .12, 'square', .05);
  else if (n === 'bell') { tone(660, .9, 'sine', .12); tone(990, .9, 'sine', .05); setTimeout(() => { tone(660, 1.1, 'sine', .12); tone(990, 1.1, 'sine', .05); }, 380); }
}

/* ===================== Levelgenerator ===================== */
// n >= 1: vast level (deterministisch per nummer). n === 0: oneindig, wordt onderweg bijgebouwd.
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const PW = 26, PH = 40, DH = 20, GW = 16, FOE_GOLD = [5, 8]; // krab, meeuw

function newGen(n, seed) {
  return { n, r:rng(n ? n*7919 + 13 : (seed || Date.now())), x:600, y:500, pearls:0, nextPearl:2500, done:false,
    len:n ? 4600 + Math.min(n, 20)*420 : Infinity,
    blocks:[{ x:-900, y:500, w:1500 }], plats:[], coins:[], foes:[], gates:[], flagX:Infinity, flagY:0 };
}
function extend(L, until) {
  const r = L.r, n = L.n;
  while (!L.done && L.x < until) {
    if (L.x >= L.len) { // slotstuk met de klok
      L.x += 80; L.y = clamp(L.y, 420, 520);
      L.blocks.push({ x:L.x, y:L.y, w:1400 });
      if (L.pearls === 0) L.coins.push({ x:L.x + 120, y:L.y - 120, t:1 });
      L.flagX = L.x + 320; L.flagY = L.y; L.done = true; break;
    }
    const D = n ? clamp((n-1)/14, 0, 1) : clamp(L.x/26000, 0, 1);
    let x = L.x, y = L.y, dy, gap = 0;
    if (r() < .45 + .15*D) { gap = 70 + r()*(50 + 60*D); dy = (r()*2 - 1)*40; }
    else dy = (r() < .5 ? -1 : 1)*(30 + r()*40);
    let ny = clamp(y + dy, 400, 540);
    if (!gap && Math.abs(ny - y) < 24) ny = y; // geen bijna onzichtbare drempels waar je op vastloopt
    if (gap) for (let i = 1; i <= 4; i++) { const k = i/5; L.coins.push({ x:x + gap*k, y:(y + (ny-y)*k) - 30 - Math.sin(k*Math.PI)*70, t:0 }); }
    x += gap; y = ny;
    const w = 240 - 40*D + r()*360, roll = r(); let crab = false, gate = false;
    L.blocks.push({ x, y, w });
    if (w > 330 && roll < .3 + .35*D) { // krab
      const a = x + 140, b = x + w - 50; crab = true;

  }

  }
  for (const c of G.coins) {
    const x = c.x - cam; if (x > W + 20 || x < -20) continue; const y = c.y + OY + Math.sin(G.t*4 + c.x*.05)*3;
    if (c.t) { ctx.fillStyle = '#ffffff66'; ctx.beginPath(); ctx.arc(x, y, 15, 0, 7); ctx.fill(); ctx.drawImage(SPR.pearl, x - 12, y - 12, 24, 24); }
    else ctx.drawImage(SPR.coin, x - 11, y - 11, 22, 22);
  }
  for (const f of G.foes) if (!f.dead && f.x - cam < W + 40 && f.x - cam > -40) drawFoe(f, cam);
  drawHero(G.p.x - cam, G.p.y + OY, G.p);
  for (const q of G.parts) { ctx.fillStyle = q.col; ctx.globalAlpha = Math.max(0, q.l*2); ctx.fillRect(q.x - cam - 2, q.y + OY - 2, 4, 4); }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = 'bold 17px system-ui';
  for (const q of G.pops) { ctx.globalAlpha = Math.min(1, q.l*2); ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.strokeText(q.txt, q.x - cam, q.y + OY); ctx.fillStyle = '#8a5a00'; ctx.fillText(q.txt, q.x - cam, q.y + OY); }
  ctx.globalAlpha = 1;
  const wx = G.floodX - cam; // vloedgolf
  if (wx > -30) {
    const edge = y => wx + Math.sin(y*.035 + G.t*5)*9 + Math.sin(y*.011 - G.t*2)*8;
    ctx.fillStyle = 'rgba(28,104,184,.86)'; ctx.beginPath(); ctx.moveTo(-10, 0);
    for (let y = 0; y <= H + 14; y += 14) ctx.lineTo(edge(y), y);
    ctx.lineTo(-10, H); ctx.fill();
    ctx.strokeStyle = '#eaf6ff'; ctx.lineWidth = 4; ctx.beginPath();
    for (let y = 0; y <= H + 14; y += 14) ctx.lineTo(edge(y), y);
    ctx.stroke();
  }
}
function drawHud() {
  const p = G.p, dist = p.x - G.floodX, danger = clamp(1 - (dist - 60)/(G.fMax - 60), 0, 1);
  if (danger > .35) { ctx.fillStyle = `rgba(28,104,184,${(danger - .35)*.9*(.7 + .3*Math.sin(G.t*10))})`; ctx.fillRect(0, 0, 14 + danger*26, H); }
  const bx = 16, bw = W - 32, by = 18;
  ctx.textBaseline = 'middle';
  if (G.n === 0) { // oneindig: afstand i.p.v. voortgang
    ctx.fillStyle = '#0b1c2c99'; rr(bx - 4, by - 8, bw + 8, 26, 13); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 15px system-ui'; ctx.textAlign = 'left'; ctx.fillText('∞  ' + meters() + ' m', bx + 8, by + 5);
    ctx.textAlign = 'right'; ctx.font = '13px system-ui'; ctx.fillText('record ' + Math.max(SV.best, meters()) + ' m', bx + bw - 8, by + 5);
  } else { // voortgangsbalk = de vloedklok
    const k = v => bx + clamp(v/G.flagX, 0, 1)*bw;
    ctx.fillStyle = '#0b1c2c99'; rr(bx - 4, by - 4, bw + 8, 18, 9); ctx.fill();
    ctx.fillStyle = '#2b7fc4'; rr(bx, by, Math.max(4, k(G.floodX) - bx), 10, 5); ctx.fill();
    ctx.fillStyle = '#ffc928'; ctx.beginPath(); ctx.arc(k(p.x), by + 5, 7, 0, 7); ctx.fill();
    ctx.font = '16px system-ui'; ctx.textAlign = 'right'; ctx.fillText('🔔', bx + bw + 6, by + 5);
  }
  ctx.textAlign = 'left'; ctx.font = '18px system-ui'; let hs = ''; for (let i = 0; i < G.hearts; i++) hs += '❤️'; ctx.fillText(hs, 14, 54);
  ctx.font = 'bold 18px system-ui'; ctx.textAlign = 'right'; ctx.fillStyle = '#10263b';
  ctx.fillText(`🪙 ${G.gold}   ⚪ ${G.pearls}`, W - 14, 54);
  ctx.textAlign = 'center';
  if (G.n) { ctx.font = 'bold 13px system-ui'; ctx.fillStyle = '#10263bcc'; ctx.fillText('Expeditie ' + G.n, W/2, 54); }
  if (G.n <= 1 && G.t < 7 && G.mode === 'play') {
    ctx.fillStyle = '#0b1c2ccc'; rr(W/2 - 175, OY + 185, 350, 80, 12); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 15px system-ui'; ctx.fillText('Tik = springen · vasthouden = hoger', W/2, OY + 204);
    ctx.fillText('Veeg omlaag = bukken onder sluisdeuren', W/2, OY + 226);
    ctx.font = '14px system-ui'; ctx.fillText('Tik in de lucht = dubbelsprong · spring op krabben', W/2, OY + 248);
  }
  if (p.stall > .15 && Math.floor(G.t*6) % 2) { ctx.fillStyle = '#c92a2a'; ctx.font = 'bold 22px system-ui'; ctx.fillText(p.gateStall ? 'BUK!  ↓ veeg omlaag' : 'SPRING!', W/2, OY + 300); }
}
function draw() {
  ctx.setTransform(S, 0, 0, S, 0, 0);
  if (G.mode === 'dorp') { drawBg(G.bgX); ctx.fillStyle = '#2b7fc4'; ctx.fillRect(0, OY + 520, W, H); return; }
  const cam = G.p.x - W*.25;
  drawBg(cam); drawWorld(cam); drawHud();
}

/* ===================== Lus & invoer ===================== */
let last = 0, acc = 0;
function frame(t) {
  const dt = Math.min(.05, (t - last)/1000 || 0); last = t;
  if (G.mode === 'play') { acc += dt; while (acc >= STEP && G.mode === 'play') { step(); acc -= STEP; } }
  else { acc = 0; G.t += dt; G.bgX += dt*25; }
  draw(); requestAnimationFrame(frame);
}
// Eén duim: tik = springen, vasthouden = hoger, omlaag vegen (en vasthouden) = bukken.
let pid = null, py0 = 0;
cv.addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); pid = e.pointerId; py0 = e.clientY; press(); });
addEventListener('pointermove', e => { if (e.pointerId === pid && e.clientY - py0 > 22) duckOn(); });
function up(e) { if (e.pointerId !== pid) return; pid = null; duckOff(); release(); }
addEventListener('pointerup', up); addEventListener('pointercancel', up);
addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); audioInit(); press(); }
  else if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); duckOn(); }
});
addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'ArrowUp') release(); else if (e.code === 'ArrowDown' || e.code === 'KeyS') duckOff(); });
addEventListener('contextmenu', e => e.preventDefault());

window.VK = { G, get SV() { return SV; }, start, step, press, release, duckOn, duckOff, genLevel };
goDorp(); requestAnimationFrame(frame);
</script>
